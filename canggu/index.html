    const ingBtn = i => `<button class="sbtn ${sh.ing === i ? 'on' : ''}" data-a="shopIng" data-ing="${i}" ${E.supplyCount(g, i) < n ? 'disabled' : ''} aria-label="Buy ${n} ${E.ING_INFO[i].n}, ${E.supplyCount(g, i)} in supply">${asset(i)}<small>${E.ING_INFO[i].n}</small><small class="left">${E.supplyCount(g, i)} left</small></button>`;
    const spBtn = (kind, i) => { const k = kind === 'cheap' ? 3 : 2, picks = sh[kind], cnt = picks.filter(x => x === i).length;
      return `<button class="sbtn ${cnt ? 'on' : ''}" data-a="shopSp" data-kind="${kind}" data-spice="${i}" ${picks.length >= k || cnt >= E.supplyCount(g, i) ? 'disabled' : ''} aria-label="${E.SP_INFO[i].n}, ${E.supplyCount(g, i)} in supply">${cnt ? `<span class="pickn">×${cnt}</span>` : ''}${asset(i)}<small>${E.SP_INFO[i].n}</small><small class="left">${E.supplyCount(g, i)} left</small></button>`; };
    const grp = (kind, title, sub, btns) => `<div class="sgroup sg-${kind} ${tab === kind ? 'on' : tab ? 'off' : ''}"><div class="sg-h"><b>${title}</b><small>${sub}</small></div><div class="shoprow">${btns}</div></div>`;
    let body = '';
    if (tab === 'ing' && sh.ing) {
      const opts = (pantry && E.PANTRY_INGS.includes(sh.ing) ? ['C'] : ['A', 'B']).filter(r => !g.locked[r]);
      const nm = E.ING_INFO[sh.ing].n.toLowerCase();
      if (opts.length === 2) {
        body = `<p class="step">Where do the ${n} ${nm} go?</p>${splitView(g, sh, n)}<button class="btn big buybtn" data-a="buyIng" data-split="${Math.max(0, Math.min(n, sh.split == null ? Math.ceil(n / 2) : sh.split))}">Buy ${n} ${nm} · 1 coin</button>`;
      } else if (opts.length === 1) {
        body = `<p class="step">All ${n} go to <span class="room-${opts[0]}">${ROOM_LABEL[opts[0]]}</span> (has ${g.storage[opts[0]][sh.ing]}).</p><button class="btn big buybtn" data-a="buyIng" data-room="${opts[0]}">Buy ${n} ${nm} · 1 coin</button>`;
      } else body = '<p class="note">That storage room is locked.</p>';
    } else if (tab === 'cheap' || tab === 'pricey') {
      const k = tab === 'cheap' ? 3 : 2, picks = sh[tab];
      body = `<div class="tray"><span class="tray-l">Into the spice bag:</span>${Array.from({ length: k }, (_, i) => `<span class="slot">${picks[i] ? asset(picks[i]) : ''}</span>`).join('')}${picks.length ? '<button class="link" data-a="shopClear" data-kind="' + tab + '">start again</button>' : ''}</div>
        <button class="btn big buybtn" data-a="buySp" data-kind="${tab}" ${picks.length === k ? '' : 'disabled'}>${picks.length === k ? `Buy these ${k} · 1 coin` : `Tap ${k - picks.length} more spice${k - picks.length > 1 ? 's' : ''}`}</button>`;
    } else body = '<p class="note shop-start">Tap what you want to buy.</p>';
    return `<div class="sheet shopsheet"><div class="card shop">
      <h2>🛵 Scooter run <small class="badge">${left > 1 ? '2 purchases this trip' : '1 purchase'} · office has ${g.coins} 🪙</small></h2>
      <p class="note">One purchase costs 1 coin. Choose one of the three:</p>
      <div class="shopgrid">
        ${grp('ing', `${n} of one ingredient`, 'into Fridge A and B', E.ING.map(ingBtn).join(''))}
        <div class="sg-pair">
          ${grp('cheap', '3 cheap spices', 'any mix', E.CHEAP.map(i => spBtn('cheap', i)).join(''))}
          ${grp('pricey', '2 expensive spices', 'any mix', E.PRICEY.map(i => spBtn('pricey', i)).join(''))}
        </div>
      </div>
      <div class="shopbody">${body}</div>
      <button class="btn ghost" data-a="done">${g.duo && left < 2 ? 'Done shopping' : 'Buy nothing'}</button>
    </div></div>`;
  }

  function renderOffice(g) {
    const cfg = E.cfgOf(g);
    const striking = [];
    Object.keys(g.off).forEach(owner => g.off[owner].forEach((off, t) => { if (off) striking.push({ owner, t }); }));
    const late = striking.length
      ? striking.map(x => `<button class="obtn" data-a="latePay" data-owner="${x.owner}" data-t="${x.t}" ${g.coins < E.LATE_PAY ? 'disabled' : ''}><b>⛔ ${esc(whoOf(g, x.owner).name)}'s ${x.owner === 'temp' ? 'temp' : `timer ${x.t + 1}`}</b><small>Pay ${E.LATE_PAY} 🪙 — it works again</small></button>`).join('')
      : '<p class="note">No chef is on strike.</p>';
    const cards = cfg.officeCards ? (g.officeOpen.length
      ? g.officeOpen.map(k => { const c = E.OFFICE[k]; return `<button class="obtn" data-a="officeCard" data-card="${k}" ${g.coins < c.cost ? 'disabled' : ''}><b>${c.e} ${c.n} · ${c.cost} 🪙</b><small>${c.d.replace(/sand timer/g,'chef').replace(/timer/g,'chef')}</small></button>`; }).join('')
      : '<p class="note">Nothing left to order.</p>') : '';
    return `<div class="sheet shopsheet"><div class="card shop">
      <h2>🏢 Office</h2>
      <p class="note">The office has ${g.coins} coins. Pick one thing.</p>
      ${cfg.strike ? `<h3>Late payment</h3><div class="olist">${late}</div>` : ''}
      ${cfg.officeCards ? `<h3>Order help</h3><div class="olist">${cards}</div>` : ''}
      <button class="btn ghost" data-a="done">Do nothing</button>
    </div></div>`;
  }

  // ---------- dining room, readable size ----------
  // The plan shows guests' orders small; these cards repeat them at a size a child can read.
  function bigGuest(g, dishId) {
    const d = E.DISHES[dishId], money = E.cfgOf(g).money;
    const icons = x => E.ING.filter(i => x.ing[i]).map(i => `<span class="gi" title="${E.ING_INFO[i].n}">${asset(i)}${x.ing[i] > 1 ? `<b>${x.ing[i]}</b>` : ''}</span>`).join('')
      + E.SPICES.filter(i => x.sp[i]).map(i => `<span class="gi sp" title="${E.SP_INFO[i].n}">${asset(i)}${x.sp[i] > 1 ? `<b>${x.sp[i]}</b>` : ''}</span>`).join('');
    const part = x => `<div class="bg-part">${dishArt(x)}<div class="bg-body"><div class="bg-name">${x.ch ? '⭐ ' : ''}${x.name}</div><div class="bg-icons">${plateBadge(x.plate)}${icons(x)}<span class="gi cook" title="Cook ${x.cook}×">🍳<b>${x.cook}</b></span></div></div></div>`;
    if (d.vip) return `<div class="bg-vip">👑 VIP · ${d.name}${money ? ` · ${coin(d.c)}` : ''}<small>both dishes must be right</small></div>${d.parts.map(k => part(E.DISHES[k])).join('')}`;
    return `${part(d)}${money ? `<span class="bg-price">${coin(d.c)}</span>` : ''}`;
  }
  function renderOrderSheet(g) {
    const cfg = E.cfgOf(g), op = myOpen(g);
    const guests = g.seats.map((x, i) => x.dish ? `<button class="gcard ${E.DISHES[x.dish].vip ? 'vip' : ''}" data-a="takeOrder" data-seat="${i}">${bigGuest(g, x.dish)}</button>` : '').join('');
    const mine = g.orders.filter(o => o.pid === me.pid && !o.served).filter((o, i, all) => !o.group || all.findIndex(x => x.group === o.group) === i);
    const serve = cfg.service && mine.length ? `<h3>…or serve one of your meals early</h3><div class="serve-list">${mine.map(o => { const d = E.DISHES[o.patron || o.dish]; return `<div class="serve-item">${dishArt(E.DISHES[o.dish])}<b>${d.name}</b>${serveBtn(g, o)}</div>`; }).join('')}</div>` : '';
    return `<div class="sheet ordersheet"><div class="card orderpick" data-stop="1">
      <h2>📝 Take an order</h2>
      ${guests ? `<p class="note">Tap a guest. Their meal becomes your ticket.</p><div class="guest-grid">${guests}</div>` : '<p class="note">Nobody is waiting at the tables. Seat new guests at the reception 🚪.</p>'}
      ${serve}
      <div class="rbtns"><button class="btn ghost" data-a="hideOrders" data-start="${op && op.worker ? op.worker.start : 0}">Look at the board</button><button class="btn ghost" data-a="done">Skip</button></div>
    </div></div>`;
  }
  function renderSeatPeek(g, i) {
    const x = g.seats[i];
    if (!x || !x.dish) { ui.seatPeek = null; return ''; }
    return `<div class="sheet" data-a="closeSeat"><div class="card orderpick" data-stop="1"><h2>Guest at table</h2><div class="guest-grid one"><div class="gcard">${bigGuest(g, x.dish)}</div></div><p class="note">To take this order, put a chef on a free dining space 📝.</p><button class="btn ghost" data-a="closeSeat">Close</button></div></div>`;
  }

  // ---------- Canggu: pings ----------
  const PING_SHOW = 8000, PING_URGENT = 3000;
  let heardPings = 0;
  function pingWhat(p) {
    if (p.ing) return `${E.ING_INFO[p.ing].n}!`;
    if (p.spice) return `${E.SP_INFO[p.spice].n.split(/[ &]/)[0]}!`;
    return p.area ? `Over here — ${E.AREA_NAME[p.area]}` : 'Over here!';
  }
  function livePings(g, now) { return (g.pings || []).filter(p => now - p.at < PING_SHOW); }
  function pingSounds(g, now) {
    claimSounds(g, now);
    const fresh = livePings(g, now).filter(p => p.id > heardPings);
    if (!fresh.length) return;
    heardPings = Math.max.apply(null, fresh.map(p => p.id));
    const others = fresh.filter(p => p.pid !== me.pid);
    if (others.some(p => p.panic)) SFX.panic(); else if (others.length) SFX.sonar();
  }
  let heardClaims = '';
  function claimSounds(g, now) {
    const k = livePings(g, now).filter(p => p.pid === me.pid && p.claimedBy).map(p => p.id).join(',');
    if (k && k !== heardClaims && k.split(',').some(id => !heardClaims.split(',').includes(id))) SFX.claim();
    heardClaims = k;
  }
  function pingLayer(g, now) {
    return `<div class="pings" aria-hidden="true">${livePings(g, now).map(p => {
      const c = colorOf((whoOf(g, p.pid) || {}).color);
      return `<span class="ping ${p.panic ? 'panic' : ''} ${p.claimedBy ? 'claimed' : ''}" data-pat="${p.at}" data-pclaim="${p.claimedBy ? 1 : 0}" style="left:${p.x}%;top:${p.y}%;--c:${c}"><i></i><i></i><b>${esc(pingWhat(p))}</b></span>`;
    }).join('')}</div>`;
  }
  function pingBar(g, now) {
    const list = livePings(g, now);
    if (!list.length) return '';
    const name = id => esc((whoOf(g, id) || { name: '?' }).name);
    return list.slice(-3).map(p => {
      const c = colorOf((whoOf(g, p.pid) || {}).color), mine = p.pid === me.pid;
      const state = p.claimedBy ? `<em class="onit">✓ ${p.claimedBy === me.pid ? 'You are' : name(p.claimedBy) + ' is'} on it</em>`
        : mine ? '<em>waiting for an answer…</em>' : `<button class="btn" data-a="claim" data-ping="${p.id}">On it!</button>`;
      return `<div class="mom pingrow ${p.panic ? 'panic' : ''} ${p.claimedBy ? 'claimed' : ''}" data-pat="${p.at}" data-pclaim="${p.claimedBy ? 1 : 0}" style="--c:${c}"><b>📡 ${mine ? 'You' : name(p.pid)}: ${esc(pingWhat(p))}</b>${state}</div>`;
    }).join('');
  }

  // ---------- Canggu: team moments bar ----------
  let seenMoments = '';
  // What a group asks of the team, in one sentence (front desk and bar).
  function groupRule(g, m) {
    const L = E.levelOf(g), win = Math.round(L.win / 1000), cfg = E.cfgOf(g);
    const fail = `Missed: they leave without paying${cfg.rep ? ', −1 ⭐' : ''}.`;
    if (m.kind === 'birthday') return `${m.dishes.length} orders at one table, one per chef. Every plate must arrive within ${win} s of the first.${cfg.money ? ` Made it: +${m.dishes.length} 🪙 tip.` : ''} ${fail}`;
    return `2 orders for two chefs. She films for 30 s, starting 1 minute after sitting down: both items inside that slot, within ${win} s of each other.${cfg.money ? ' Made it: +2 🪙 tip.' : ''} ${fail}`;
  }
  function momentBar(g, now) {
    pingSounds(g, now);
    const L = E.levelOf(g), win = Math.round(L.win / 1000);
    const live = (g.moments || []).filter(m => m.state === 'live' || m.state === 'queued' || m.state === 'seated');
    const recent = (g.moments || []).filter(m => (m.state === 'met' || m.state === 'missed' || m.state === 'declined') && m.endedAt && now - m.endedAt < 7000);
    const key = live.map(m => m.id + m.state).join(',');
    if (key && key !== seenMoments && key.split(',').some(id => !seenMoments.split(',').includes(id))) SFX.moment();
    seenMoments = key;
    const pings = pingBar(g, now);
    if (!live.length && !recent.length && !pings) return '';
    const who = pid => esc((playerOf(g, pid) || { name: '?' }).name);
    const rows = live.map(m => {
      const I = E.MOMENT_INFO[m.kind];
      if (m.kind === 'delivery') return `<div class="mom live"><b>${I.e} Acai delivery at the back door!</b><span>Send any chef to a fridge — <b class="mleft" data-mend="${m.until}"></b> before it melts.</span></div>`;
      const what = m.kind === 'birthday' ? `A birthday party of ${m.dishes.length}` : 'An influencer';
      if (m.state === 'queued') {
        const next = E.headGroup(g) === m;
        return `<div class="mom queued"><b>${I.e} ${what} ${next ? 'is next in line' : 'is waiting outside'}</b><span>Send a chef to the front desk to seat them or turn them away. ${esc(groupRule(g, m))}</span></div>`;
      }
      // seated: orders to take, then to serve together
      const parts = E.momentOrders(g, m);
      const left = m.dishes.length - parts.length;
      const list = parts.map(o => `<span class="mpart ${o.servedAt != null ? 'done' : ''}">${who(o.pid)} · ${esc(E.DISHES[o.dish].name)}${o.servedAt != null ? ' ✓' : ''}</span>`).join('')
        + (left ? `<span class="mpart open">${left} order${left > 1 ? 's' : ''} still at the table</span>` : '');
      const mine = parts.filter(o => o.pid === me.pid && o.servedAt == null);
      const canServe = m.kind !== 'influencer' || now >= m.slotStart;
      const btns = mine.map(o => `<button class="btn" data-a="serveMoment" data-order="${o.id}" ${canServe ? '' : 'disabled'}>Serve my ${esc(E.DISHES[o.dish].name)}</button>`).join('');
      const served = parts.filter(o => o.servedAt != null).map(o => o.servedAt);
      const take = left ? `Take their orders in the dining room — one per chef. ` : '';
      if (m.kind === 'birthday') {
        const clock = served.length ? `<b class="mleft" data-mend="${Math.min.apply(null, served) + L.win}"></b> for the rest!` : `Serve every plate within ${win} s of the first.`;
        return `<div class="mom live"><b>${I.e} Birthday party at the table</b><span>${take}${clock}</span><div class="mparts">${list}</div>${btns}</div>`;
      }
      const before = now < m.slotStart;
      const clock = before ? `Filming starts in <b class="mleft" data-mend="${m.slotStart}"></b>` : `Filming now — <b class="mleft" data-mend="${m.slotEnd}"></b> left`;
      return `<div class="mom live ${before ? '' : 'hot'}"><b>${I.e} Influencer photo shoot</b><span>${take}${clock}. Both items within ${win} s of each other.</span><div class="mparts">${list}</div>${btns}</div>`;
    }).join('');
    const done = recent.map(m => {
      const I = E.MOMENT_INFO[m.kind];
      if (m.state === 'declined') return `<div class="mom declined"><b>${I.e} ${I.n}: turned away</b><span>No harm done.</span></div>`;
      const gain = m.kind === 'delivery' ? `+${m.gain} ${esc(E.ING_INFO[m.ing].n)} in Fridge A` : m.tip ? `+${m.tip} coin tip` : 'nicely done';
      return `<div class="mom ${m.state}"><b>${I.e} ${I.n}: ${m.state === 'met' ? 'made it!' : 'missed'}</b><span>${m.state === 'met' ? gain : esc(m.why || '')}${m.repLoss ? ' · −1 reputation' : ''}</span></div>`;
    }).join('');
    return `<div class="moments" role="status">${pings}${rows}${done}</div>`;
  }
  // The next guests in the queue outside, so the team can see what is coming.
  function nextInLine(g) {
    const top = g.deck.slice(-3).reverse();
    return top.map(x => {
      if (E.isGroup(x)) { const m = E.momentOf(g, +x.slice(4)); if (!m) return ''; return `<span class="nl grp">${E.MOMENT_INFO[m.kind].e}${m.kind === 'birthday' ? '×' + m.dishes.length : ''}</span>`; }
      const d = E.DISHES[x]; return d ? `<span class="nl">${d.vip ? '👑' : d.ch ? '⭐' : '🙂'}</span>` : '';
    }).join('');
  }

  // ---------- Canggu: cancel a running chef ----------
  // Chefs this player could cancel right now: own timers and shared ones they sent out, sand still running.
  function runningChefs(g, now) {
    return [me.pid, 'temp', 'helper'].filter(o => g.workers[o]).flatMap(owner => g.workers[owner].map((w, t) => ({ owner, t, w })))
      .filter(x => x.w && !g.off[x.owner][x.t] && !E.timerReady(g, x.w, now) && (x.owner === me.pid || x.w.by === me.pid));
  }
  function lossText(w) {
    const c = (w.cooked || []).length, k = (w.washed || []).length;
    const parts = [];
    if (c) parts.push(`the cooking step${c > 1 ? 's' : ''} on this visit`);
    if (k) parts.push(`${k} washed plate${k > 1 ? 's' : ''} (back to dirty)`);
    return parts.length ? `You lose ${parts.join(' and ')}.` : 'Nothing is lost: ingredients and spices stay on the plates.';
  }
  function renderCancel(g, now) {
    const cs = ui.cancelSheet, only = cs.only;
    const list = runningChefs(g, now).filter(x => !only || (x.owner === only.owner && x.t === only.t));
    if (!list.length) { ui.cancelSheet = null; return ''; }
    const dest = cs.go ? E.AREA_NAME[cs.go.area] : '';
    const rows = list.map(x => {
      const p = whoOf(g, x.owner), left = Math.ceil((x.w.start + E.workerMs(g) - now) / 1000);
      return `<div class="worker-row">${chef(p.color)}<div><b>${esc(E.AREA_NAME[x.w.area])} · ${left} s left</b><small>${esc(lossText(x.w))}</small></div><button class="btn" data-a="cancelGo" data-owner="${x.owner}" data-t="${x.t}">${dest ? `Cancel · go to ${esc(dest)}` : 'Cancel this chef'}</button></div>`;
    }).join('');
    return `<div class="sheet"><div class="card worker-card"><span class="eyebrow">Drop everything?</span><h2>${only ? 'This chef is still working' : 'All your chefs are busy'}</h2><p>Cancel a chef to free them at once. Cooking and washing from that visit are lost.</p>${rows}<button class="btn ghost" data-a="closeCancel">Keep working</button></div></div>`;
  }

  // ---------- team panel: what the other chefs are doing right now ----------
  function renderWorkers(g, now) {
    const owners = [me.pid, 'temp', 'helper'].filter(id=>g.workers[id]);
    const rows = owners.flatMap(owner=>g.workers[owner].map((w,t)=>{
      const p=whoOf(g,owner), off=g.off[owner][t], ready=!off&&E.timerReady(g,w,now);
      return `<div class="worker-row">${chef(p.color)}<div><b>${esc(p.name)} · chef ${t+1}</b><small>${off?'On strike':!w?'Off the floor, ready':`${E.AREA_NAME[w.area]} · ${ready?'ready to move':Math.ceil((w.start+E.workerMs(g)-now)/1000)+'s left'}`}</small></div>${w?`<button class="btn ghost" data-a="recall" data-owner="${owner}" data-t="${t}" ${ready?'':'disabled'}>Free this space</button>`:''}</div>`;
    })).join('');
    return `<div class="sheet"><div class="card worker-card"><h2>My chefs &amp; shared help</h2><p>Tap a floor circle to move a ready chef. You can also take a finished chef off the floor to free their space for someone else.</p>${rows}<button class="btn" data-a="workers">Back to kitchen</button></div></div>`;
  }
  const AREA_ICON = { reception: '🚪', dining: '📝', storA: '📦', storB: '📦', storC: '📦', stove: '🔥', green: '🌿', sink: '🧽', van: '🚐', office: '🏢' };
  const ROOM_NO = { A: 1, B: 2, C: 3 };
  function doingText(g, pid, now) {
    const op = g.open[pid];
    if (op) {
      return {
        order: 'is in the dining room', reception: 'is at the front desk', storage: `is fetching ingredients from ${ROOM_LABEL[op.room] || 'a fridge'}`,
        spice: 'is at the superfood bar', cook: 'is at the stove', wash: 'is washing plates', shop: 'is on a scooter run', office: 'is in the office',
      }[op.type] || '';
    }
    if (g.phase !== 'play' || now < g.shiftStart) return '';
    return E.workerReady(g, pid, now) ? 'has a free chef' : 'is waiting for the sand';
  }
  // Just the dish — whether it's right is for the chef to check, same as on your own tickets.
  function ticketSummary(g, o) {
    const d = E.DISHES[o.dish];
    return `<span class="ts ${o.served || o.parked ? 'srv' : ''}" title="${esc(d.name)}">${dishArt(d)}${o.served ? '🛎️' : o.parked ? '✓' : ''}</span>`;
  }
  function teamPanel(g, now) {
    const mates = g.players.filter(p => p.id !== me.pid);
    if (!mates.length) return '';
    return `<div class="team">${mates.map(p => {
      const ws = g.workers[p.id] || [], off = g.off[p.id] || [];
      const timers = ws.map((w, t) => off[t] ? '<span class="mtt strike" title="On strike">⛔</span>'
        : w ? `<span class="mtt" style="--c:${COLORS[p.color]}" data-wstart="${w.start}" title="${E.AREA_NAME[w.area]}"><span class="mi">${AREA_ICON[w.area]}</span><em class="sec"></em></span>`
        : '<span class="mtt idle" title="Free">·</span>').join('');
      const os = g.orders.filter(o => o.pid === p.id);
      return `<div class="mate" style="--c:${COLORS[p.color]}" data-a="mate" data-id="${p.id}" role="button" aria-label="Show ${esc(p.name)}'s orders">
        <b>${esc(p.name)}</b><span class="mtimers">${timers}</span><span class="doing">${doingText(g, p.id, now)}</span><span class="msum">${os.map(o => ticketSummary(g, o)).join('')}</span>
      </div>`;
    }).join('')}</div>`;
  }
  function helpBtn(g, o) {
    const op = myOpen(g);
    if (!g.duo || !op || o.served || o.parked) return '';
    if (op.type === 'storage') return `<button class="btn" data-a="helpSel" data-order="${o.id}">📦 Put ingredients on this</button>`;
    if (op.type === 'spice') return `<button class="btn" data-a="helpSel" data-order="${o.id}">🌿 Put spices on this</button>`;
    if (op.type === 'cook') return `<button class="btn" data-a="helpCook" data-order="${o.id}">🔥 Cook one step</button>`;
    return '';
  }
  function renderMate(g, pid) {
    const p = playerOf(g, pid);
    const os = g.orders.filter(o => o.pid === pid);
    return `<div class="sheet" data-a="closeMate"><div class="card matecard" data-stop="1" style="--c:${COLORS[p.color]}">
      <h2>${dot(p.color)}${esc(p.name)}'s orders</h2>
      <div class="mytks">${os.length ? os.map(o => `<div class="helpwrap">${ticket(g, o, false)}${helpBtn(g, o)}</div>`).join('') : '<p class="none">No orders yet.</p>'}</div>
      ${g.duo ? '<p class="note">Two-chef rule: you may put ingredients and spices on these meals and cook them. Plates and serving stay with their chef.</p>' : ''}
      <button class="btn" data-a="closeMate">Close</button>
    </div></div>`;
  }

  function feedLine(g, f) {
    if (f.k === 'moment') {
      const I = E.MOMENT_INFO[f.kind] || { e: '', n: '' };
      const t = f.phase === 'start' ? 'started' : f.phase === 'queued' ? 'is waiting outside' : f.phase === 'declined' ? 'was turned away' : f.phase === 'met' ? 'made it!' : `missed${f.why ? ' — ' + esc(f.why) : ''}`;
      return `<li class="momline"><b>${I.e} ${I.n}</b> ${t}</li>`;
    }
    const p = whoOf(g, f.pid);
    const dn = k => k && E.DISHES[k] ? `${E.DISHES[k].e} ${E.DISHES[k].name}` : '';
    const money = E.cfgOf(g).money;
    const forTxt = () => f.for ? `${esc(whoOf(g, f.for).name)}'s ` : '';
    const txt = {
      seat: () => `seated ${f.n} guest${f.n > 1 ? 's' : ''}${money ? ` (+${f.n * (E.has(g, 'drinks') ? 2 : 1)} 🪙 kombucha)` : ''}`,
      throw: () => `sent away ${f.n} guest${f.n > 1 ? 's' : ''}`,
      order: () => `took the order: ${dn(f.dish)}`,
      serve: () => `served ${dn(f.dish)} early (+${f.tip} 🪙 tip)`,
      plate: () => `took a ${E.PLATE_NAME[f.size].toLowerCase()} plate for ${dn(f.dish)}`,
      ing: () => `put ${(f.items || []).map(i => E.ING_INFO[i].e).join('')} on ${forTxt()}${dn(f.dish)}`,
      spice: () => `seasoned ${forTxt()}${dn(f.dish)} with ${(f.items || []).map(i => E.SP_INFO[i].e).join('')}`,
      cook: () => `cooked ${forTxt()}${dn(f.dish)} (${f.row} of ${f.cook})`,
      wash: () => `washed ${(f.items || []).length} plate${(f.items || []).length > 1 ? 's' : ''}`,
      buy: () => f.ing ? `bought ${f.n} ${E.ING_INFO[f.ing].e} (−1 🪙)` : `bought ${(f.spices || []).map(i => E.SP_INFO[i].e).join('')} (−1 🪙)`,
      late: () => `paid ${esc(whoOf(g, f.owner).name)}'s timer back from strike (−${E.LATE_PAY} 🪙)`,
      office: () => `${E.OFFICE[f.card].e} ${E.OFFICE[f.card].n.toLowerCase()} (−${E.OFFICE[f.card].cost} 🪙)`,
      bin: () => `binned ${dn(f.dish)}`,
      park: () => `put ${dn(f.dish)} aside as ready`,
      cancel: () => `cancelled a chef at ${E.AREA_NAME[f.area] || 'a station'}`,
      mserve: () => `served ${dn(f.dish)} ${(E.MOMENT_INFO[f.kind] || {}).e || ''}`,
    }[f.k];
    return txt ? `<li style="--c:${colorOf(p.color)}"><b>${esc(p.name)}</b> ${txt()}</li>` : '';
  }
  function feedPanel(g) {
    if (!g.feed || !g.feed.length || g.phase === 'ready' || g.players.length < 2) return '';
    return `<ul class="feed">${g.feed.slice(-2).reverse().map(f => feedLine(g, f)).join('')}</ul>`;
  }

  // ---------- score tables: who brought what in and who cost what ----------
  function sumChefs(g, reports) {
    const out = {};
    g.players.forEach(p => { out[p.id] = { served: 0, meals: 0, drinks: 0, tips: 0, shop: 0, office: 0, freeDrinks: 0, net: 0, repGain: 0, repLoss: 0, rep: 0, waiting: 0, mistakes: 0, binned: 0, thrown: 0, early: 0, seated: 0, helped: 0 }; });
    reports.forEach((r, i) => Object.keys(r.chefs || {}).forEach(pid => {
      const c = r.chefs[pid], o = out[pid];
      if (!o) return;
      Object.keys(o).forEach(k => { if (k !== 'waiting' && k !== 'mistakes') o[k] += c[k] || 0; });
      if (i === reports.length - 1) { o.waiting = c.waiting || 0; o.mistakes = c.mistakes || 0; }
    }));
    return out;
  }
  const num = (v, sign) => v ? `<span class="${sign < 0 ? 'neg' : 'pos'}">${sign < 0 ? '−' : '+'}${v}</span>` : '<span class="zero">·</span>';
  function chefTable(g, chefs, last) {
    const cfg = E.cfgOf(g);
    const rows = g.players.map(p => ({ p, c: chefs[p.id] }));
    const name = p => `<td class="who">${dot(p.color)}${esc(p.name)}</td>`;
    if (!cfg.money) {
      return `<table class="score"><thead><tr><th></th><th>Served ✓</th><th>${last ? 'Not served' : 'Still cooking'}</th><th>Mistakes</th>${g.duo ? '<th title="Ingredients, superfoods and cooking steps for the partner">🤝 Helped</th>' : ''}</tr></thead><tbody>
        ${rows.map(({ p, c }) => `<tr>${name(p)}<td><b>${c.served}</b></td><td>${c.waiting || '·'}</td><td>${(c.mistakes + c.binned) || '·'}</td>${g.duo ? `<td>${c.helped || '·'}</td>` : ''}</tr>`).join('')}
      </tbody></table>`;
    }
    const spent = c => c.shop + c.office;
    const best = Math.max.apply(null, rows.map(r => r.c.net));
    return `<table class="score"><thead><tr><th></th><th>Served</th><th title="Price of served meals">🍽️ Meals</th><th title="Drinks of guests they seated">🥤 Drinks</th>${cfg.service ? '<th title="Tips for serving early">🛎️ Tips</th>' : ''}${cfg.shop || cfg.office ? '<th title="Van and office">🛒 Spent</th>' : ''}<th title="Free drinks for guests they didn't serve">😕 Free drinks</th><th>= Coins</th>${cfg.rep ? '<th>⭐</th>' : ''}${g.duo ? '<th title="Ingredients, superfoods and cooking steps for the partner">🤝 Helped</th>' : ''}</tr></thead><tbody>
      ${rows.map(({ p, c }) => `<tr class="${c.net === best && best > 0 ? 'top' : ''}">${name(p)}<td><b>${c.served}</b>${c.mistakes || c.binned ? `<small class="neg"> ${c.mistakes + c.binned}✗</small>` : ''}</td><td>${num(c.meals, 1)}</td><td>${num(c.drinks, 1)}</td>${cfg.service ? `<td>${num(c.tips, 1)}</td>` : ''}${cfg.shop || cfg.office ? `<td>${num(spent(c), -1)}</td>` : ''}<td>${num(c.freeDrinks, -1)}</td><td class="net ${c.net < 0 ? 'neg' : ''}"><b>${c.net > 0 ? '+' : c.net < 0 ? '−' : ''}${Math.abs(c.net)}</b></td>${cfg.rep ? `<td>${c.repGain ? `<span class="pos">+${c.repGain}</span>` : ''}${c.repLoss ? ` <span class="neg">−${c.repLoss}</span>` : ''}${!c.repGain && !c.repLoss ? '<span class="zero">·</span>' : ''}</td>` : ''}${g.duo ? `<td>${c.helped || '<span class="zero">·</span>'}</td>` : ''}</tr>`).join('')}
    </tbody></table>`;
  }
  const momTips = r => (r.moments || []).reduce((a, m) => a + (m.tip || 0), 0);
  const momRep = r => (r.moments || []).reduce((a, m) => a + (m.repLoss || 0), 0);
  function momentLine(g, r) {
    if (!r.moments || !r.moments.length) return '';
    return `<p class="money">Team moments: ${r.moments.map(m => { const I = E.MOMENT_INFO[m.kind]; return `${I.e} ${I.n} ${m.ok ? `<b>made it</b>${m.tip ? ` (+${m.tip} 🪙)` : m.gain ? ` (+${m.gain} stock)` : ''}` : `<span class="neg">missed</span>${m.why ? ` — ${esc(m.why)}` : ''}`}`; }).join(' · ')}</p>`;
  }
  function teamMoney(g, r) {
    const chefs = Object.values(r.chefs || {}).reduce((a, c) => a + c.net, 0), mt = momTips(r);
    return `<p class="money">🏢 Office: start <b>${r.start}</b> ${chefs >= 0 ? '+' : '−'} chefs <b>${Math.abs(chefs)}</b>${mt ? ` + team moments <b>${mt}</b>` : ''}${r.salaryDue ? ` − salaries <b>${r.salary}</b>${r.salary < r.salaryDue ? ` <span class="neg">(${r.salaryDue - r.salary} not paid)</span>` : ''}` : ''} = <b>${r.end} coins</b></p>`;
  }
  function repLine(r) {
    if (r.repEnd == null) return '';
    const mr = momRep(r);
    return `<p class="money">⭐ Reputation ${r.repStart} + ${r.repGain} − ${r.repLoss}${mr ? ` − ${mr} team moments` : ''} = <b>${r.repEnd}</b>${r.repStart + r.repGain - r.repLoss - mr < 0 ? ' (it can\'t drop below 0)' : ''}${(r.awardsWon || (r.award ? [r.award] : [])).map(k => ` · 🏆 new award: ${E.AWARDS[k].e} ${E.AWARDS[k].n} — ${E.AWARDS[k].d}`).join('')}${(r.awardsLost || (r.awardLost ? [r.awardLost] : [])).map(k => ` · award lost: ${E.AWARDS[k].e} ${E.AWARDS[k].n}`).join('')}</p>`;
  }
  function strikeLine(g, r) {
    if (!r.strikes || !r.strikes.length) return '';
    return `<p class="money bad">⛔ Not enough coins for all salaries: ${r.strikes.map(x => `${esc(whoOf(g, x.owner).name)}${x.owner === 'temp' ? '' : `'s timer ${x.t + 1}`}`).join(', ')} went on strike. A late payment in the office (${E.LATE_PAY} 🪙) brings a timer back.</p>`;
  }
  function guestList(g, r, pid, over) {
    const money = E.cfgOf(g).money, rep = E.cfgOf(g).rep;
    const repTxt = o => rep && o.kind !== 'reg' ? ` ${o.ok ? '+' : '−'}${(o.kind === 'vip' ? 2 : 1) + (!o.ok && o.early ? 1 : 0)}⭐` : (rep && !o.ok && o.early ? ' −1⭐' : '');
    const items = r.orders.filter(o => o.pid === pid).map(o => {
      const d = E.DISHES[o.dish];
      const label = `${o.kind === 'vip' ? '👑' : d.e} ${d.name}`;
      if (o.ok) return `<li class="ok">✓ ${label}${o.early ? ' 🛎️' : ''}${money ? ` <b>+${d.c}🪙</b>` : ''}${repTxt(o)}</li>`;
      const why = `<ul class="meal-errors">${o.reasons.map(reason=>`<li>${esc(reason)}</li>`).join('')}</ul>`;
      const fate = o.fate === 'binned' && !over ? '🗑️ thrown away' : o.fate === 'waiting' && !over ? '⏳ still cooking' : '✗ not served';
      return `<li class="bad">${label} — ${fate}${money && (o.kind === 'reg' || !rep) && o.freeDrink !== 0 ? ' −1🪙' : ''}${repTxt(o)} ${why}</li>`; // Show the coins actually paid, including reports saved before per-order accounting.
    });
    return items.length ? `<ul class="glist">${items.join('')}</ul>` : '<p class="none">no guests this shift</p>';
  }

  function renderBetween(g) {
    const host = isHost();
    const r = g.reports[g.reports.length - 1];
    const hostP = wrap.lobby.players[0];
    const eq = r.equality ? `<p class="money">🛎️ Served early this shift: ${r.equality.map(x => `${esc((playerOf(g, x.pid) || {}).name)} ${x.early}`).join(', ')} (each needs ${g.goal.equality}).</p>` : '';
    return `<div class="sheet"><div class="card scorecard">
      <h2>End of shift ${r.shift} of ${g.shifts}</h2>
      ${chefTable(g, r.chefs, false)}
      ${E.cfgOf(g).money ? teamMoney(g, r) : ''}
      ${repLine(r)}${momentLine(g, r)}${strikeLine(g, r)}${eq}
      <div class="gcols">${g.players.map(p => `<div class="gcol" style="--c:${COLORS[p.color]}"><h3>${dot(p.color)}${esc(p.name)}</h3>${guestList(g, r, p.id)}</div>`).join('')}</div>
      <p class="note">Served plates went to the sink. Guests still waiting stay with their chef; thrown-away meals start again from scratch.</p>
      ${host ? `<button class="btn big" data-a="nextShift">Start shift ${r.shift + 1}</button>` : `<p class="note">Waiting for ${esc(hostP ? hostP.name : 'the host')} to start the next shift.</p>`}
    </div></div>`;
  }

  function renderReady(g) {
    const host = isHost();
    const hostP = wrap.lobby.players[0];
    const n = g.settings.scenario, t = fmt(g.settings.shiftSec * 1000);
    const cfg = E.cfgOf(g);
    const salary = activeTimers(g) * E.SALARY_PER_TIMER;
    const extra = {
      1: 'Soft opening: seat your friends, take their orders, grab the right bowl, fetch ingredients and cook.',
      2: 'New: superfoods come from the superfood bar 🍵 and can go on even while a meal cooks. A bowl one size bigger is fine. Each player now runs two chefs. Wrong ingredients stay on the plate.',
      3: 'New: most bowls start dirty — wash up to 3 per visit at the sink 🧽. A botched meal can go in the bin 🗑️: its bowl goes to the sink and the guest waits for a fresh one. Every new guest buys a kombucha (+1 coin), served meals pay their price, and every guest you took an order from but didn\'t serve gets a free kombucha (−1).',
      4: 'New: the fridges and the superfood bar start nearly empty — send a chef on a scooter run 🛵 to buy 5 of one ingredient, 3 cheap superfoods or 2 premium ones for 1 coin. ⭐ guests are demanding: more to prepare, better pay. Between shifts, served meals pay, unfinished ones keep cooking, and mistakes are thrown away.',
      5: `New: sourdough and GF pasta live only on the bakery shelf. After every shift the crew takes wages of ${E.SALARY_PER_TIMER} coins per chef — ${salary} coins for the team. If the office can't pay, the café closes.`,
      6: 'New: Google reviews ⭐. A served ⭐ guest gives +1, a ⭐ guest still waiting at the end of a shift costs −1 (no free kombucha). In the dining room you can serve a finished meal early 🛎️ for a tip (+1 coin) — but if it turns out wrong, you lose 1 more. At the front desk you can turn 1 or 2 waiting guests away; the new guests buy no kombucha.',
      7: 'New: influencers 👑 order two dishes and only pay when both are right (+2 reviews; −2 if left unfinished). Good reviews win awards 🏆 that help until the end of the game. Four shifts. Staff you can\'t pay go surfing — bring them back with a late payment in the office 🏢 (on the plan).',
      8: 'New: Fridge B is locked and one stove is broken. A casual helper 🤍 jumps in when your own chefs are busy (wages 3 per shift). The office 🏢 can call the locksmith or Pak Made the fixer, hire a second casual or buy bowls.',
    }[n] || `Master chef mission with all the rules of restaurant 8. ${SCEN_BLURB[n]}`;
    return `<div class="sheet readysheet"><div class="card">
      <h2>${scenTitle(n)}</h2>
      <p>${extra}</p>
      ${g.duo ? `<p>🤝 <b>Two-chef helpers (optional extra):</b> ${DUO_RULES}</p>` : ''}
      <p><b>Goal:</b> ${E.goalText(g.goal, g.players.length === 1)}. ${cfg.shifts > 1 ? `${cfg.shifts} shifts of ${t}.` : `${t} on the clock.`} Each player controls ${cfg.timers === 1 ? 'one chef' : 'two chefs'}; each visit keeps a chef busy for ${g.settings.workerSec} seconds.${g.settings.strict ? ' Practice mode gives live hints and blocks meal mistakes.' : ' Recipe mistakes are allowed during play and explained when the shift ends.'}</p>
      ${host ? '<button class="btn big" data-a="startShift">Start the shift</button>' : `<p class="note">Waiting for ${esc(hostP ? hostP.name : 'the host')} to start the shift.</p>`}
      <button class="link" data-a="help">How to play</button>
    </div></div>`;
  }

  function renderResults(g) {
    const R = g.results, host = isHost();
    const log = host ? LS.get('kc-log', []) : [];
    const wins = log.filter(x => (x.scenario || 1) === (R.scenario || 1) && x.win && x.goalAt != null);
    const best = wins.length ? Math.min.apply(null, wins.map(x => x.goalAt)) : null;
    const head = R.win ? 'You did it — every goal reached!'
      : R.bankrupt ? 'The office couldn\'t pay the salaries — the restaurant had to close.'
      : R.allStrike ? 'Every chef went on strike — the restaurant had to close.'
      : R.equalityFailed ? 'Not every chef served enough guests early in that shift.'
      : 'Not every goal reached this time.';
    const checks = (R.checks || []).map(c => `<li class="${c.ok ? 'ok' : 'bad'}"><span class="mark">${c.ok ? '✓' : '✗'}</span>${esc(c.label)} <small>(you: ${esc(String(c.have))})</small></li>`).join('');
    const reps = g.reports || [];
    const multi = reps.length > 1;
    return `<div class="sheet"><div class="card results scorecard ${R.win ? 'won' : 'lost'}">
      <span class="eyebrow">Canggu Kitchen · service ledger</span><h2>${head}</h2>
      <ul class="checks">${checks}</ul>
      <h3 class="sec-h">${multi ? `All ${reps.length} shifts` : 'Who did what'}</h3>
      ${chefTable(g, sumChefs(g, reps), true)}
      ${R.money ? reps.map(r => `<div class="shiftline">${multi ? `<b>Shift ${r.shift}</b> ` : ''}${teamMoney(g, r)}${repLine(r)}${momentLine(g, r)}${strikeLine(g, r)}</div>`).join('') : reps.map(r => momentLine(g, r)).join('')}
      <p class="sub">${R.served} guest${R.served === 1 ? '' : 's'} served correctly${R.goalAt != null ? ` · goal reached at ${fmt(R.goalAt)}` : ''}${best != null ? ` · best ever ${fmt(best)}` : ''}</p>
      <div class="ledger-label">Meal ledger · open a chef to inspect every meal</div>
      <div class="gcols ledger">${g.players.map(p => { const count=reps.reduce((n,r)=>n+r.orders.filter(o=>o.pid===p.id).length,0);return `<details class="gcol" data-report="${p.id}" ${ui.reportOpen?.[p.id]?'open':''} style="--c:${COLORS[p.color]}"><summary>${dot(p.color)}${esc(p.name)}<span>${count} meal${count===1?'':'s'}</span></summary>${count ? reps.map((r,i)=>r.orders.some(o=>o.pid===p.id)?`${multi?`<div class="gshift">Shift ${r.shift}</div>`:''}${guestList(g,r,p.id,i===reps.length-1)}`:'').join(''):'<p class="none">No meals this shift.</p>'}</details>`;}).join('')}</div>
      <div class="rbtns">
        ${role === 'solo' ? (R.win
          ? `${R.scenario < 13 ? '<button class="btn big" data-a="nextSolo">Next restaurant ▶</button>' : ''}<button class="btn ghost" data-a="again">Play again</button><button class="btn ghost" data-a="lobby">Campaign</button>`
          : `<button class="btn big" data-a="again">Try again</button>${R.scenario < 13 ? '<button class="btn ghost" data-a="skipSolo">Continue anyway ▶</button>' : ''}<button class="btn ghost" data-a="lobby">Campaign</button>`)
          : host ? '<button class="btn big" data-a="again">Play again</button><button class="btn ghost" data-a="lobby">Change restaurant or chefs</button><button class="btn ghost" data-a="log">Download game log</button>' : '<p class="note">The host can start the next round.</p>'}
        <button class="link" data-a="hideResults">Look at the board</button>
      </div>
    </div></div>`;
  }

  function renderHelp() {
    return `<div class="sheet" data-a="closeHelp"><div class="card help" data-stop="1">
      <h2>How to play</h2>
      <h3>New in the Canggu edition</h3>
      <ul>
        <li><b>Difficulty</b> — Chill (40 s timers, practice hints, no team moments), Normal, Hectic and Full Canggu (20 s timers, challenge goals, more team moments).</li>
        <li><b>Cancel a chef</b> — tap your own working chef, or a free circle while all your chefs are busy, to cancel one at once. Cooking and washing from that visit are lost; ingredients and superfoods stay on the plates.</li>
        <li><b>📡 Pings</b> — press and hold anywhere on the plan to ping that spot on every iPad. Tap an empty shelf to call for that ingredient. Answer a call with <b>On it!</b> so nobody else runs. An unanswered call turns red after 3 s; three quick pings mean panic.</li>
        <li><b>🎂 Birthday party</b> and <b>📸 influencer</b> guests join the queue outside; the front desk shows who is next in line. Send a chef to the front desk to seat them or turn them away (no penalty).</li>
        <li><b>🎂 Birthday party</b> — seated at one table with one order per chef: every chef takes one in the dining room. Serve them with the buttons in the bar at the top; every plate must arrive within the window of the first.</li>
        <li><b>🧊 Melting delivery</b> — send any chef to a fridge before the countdown ends, or the acai melts.</li>
        <li><b>📸 Photo shoot</b> — once seated, the influencer films for 30 s, starting a minute later. Two chefs each take one of her two orders and serve them inside the slot, close together.</li>
        <li>A missed team moment: the guests leave without paying (−1 reputation once reputation exists). A met one pays a tip once money exists. Turning a group away costs nothing.</li>
      </ul>
      <h3>The basics</h3>
      <p>Everyone plays at the same time. Tap a free circle to put a chef there and do that action straight away. The circle stays occupied until the chef finishes and moves elsewhere. Numbered green circles are free; apron-coloured rings are occupied. Locked and broken spaces are marked. Use My chefs to take a finished chef off the floor and free their space.</p>
      <ul>
        <li><b>🚪 Front desk</b> seats up to 2 new guests at free tables. From restaurant 6 a menu lets you instead turn 1 or 2 waiting guests away; their replacements buy no kombucha. If you choose nothing, new guests are seated when your chef moves on.</li>
        <li><b>📝 Dining room</b> lets you take one guest's order — or, from restaurant 6, serve one of your meals early for a tip 🛎️. Bowls and plates come from the shelf: free, any time.</li>
        <li><b>📦 Fridge</b> puts ingredients on your own plates. Take all you need from that fridge, then tap Done. An empty shelf is a button: tap it to call for that ingredient.</li>
        <li><b>🔥 Stove</b> cooks one meal one step. 🍳2 means two stove visits. Too many visits overcook it.</li>
        <li><b>Set aside</b> on your ticket (tap twice) puts a meal aside, unchecked, in the set-aside row, so your other tickets stay in view. Tap its card and Back to my orders to work on it again. It is still checked when the shift ends, and from restaurant 6 you can serve it early 🛎️ from the Ready row while your timer is in the dining room.</li>
        <li><b>🍵 Superfood bar</b> (from restaurant 2) puts coconut, chia, matcha, turmeric and goji on your plates — even on a meal that is already cooking.</li>
        <li><b>🧽 Sink</b> (from restaurant 3) washes up to 3 dirty bowls.</li>
        <li><b>🛵 Scooter run</b> (from restaurant 4, on the floor plan) buys 5 of one ingredient, 3 cheap superfoods or 2 premium ones for 1 coin.</li>
        <li><b>🤝 Two-chef helpers</b> (an optional extra; switch it on in the lobby when two chefs play): a shared helper chef (top bar) that either chef can use when their own timers are busy; you may put ingredients and superfoods on, and cook, your partner's meals — tap their row; and each scooter run allows two purchases. The helper is paid first and is the last to go on strike.</li>
        <li><b>🏢 Office</b> (from restaurant 7, on the floor plan) brings a surfing crew member back for 3 coins, and from restaurant 8 calls the locksmith or Pak Made the fixer, hires a casual or buys bowls.</li>
      </ul>
      <p>Meals are checked when a shift ends: right plate (from restaurant 2, one size bigger is fine), exactly the right ingredients and superfoods, and the right cooking. ⭐ guests are demanding (gluten-free, oat milk only, extra protein), 👑 influencers order two dishes and only pay if both are right.</p>
      <p>Restaurant 1 forgives mistakes: tap a wrong ingredient twice to put it back. From restaurant 3 on you can bin a botched meal 🗑️. From restaurant 4, games have several shifts: served meals pay, unfinished meals carry over, mistakes are thrown away. From restaurant 5 the crew takes wages after every shift; from restaurant 7 unpaid staff go surfing until you pay them.</p>
      <p>In standard play, you check the recipe yourself during the rush. The shift report lists every missing or extra ingredient, superfood, plate and cooking mistake. Choose Practice: live hints before starting for immediate help. When time expires, finish actions already started, then tap Done or Skip; new visits are closed.</p><p class="note">Canggu Kitchen: a real-time co-op cooking game set in a Bali health-food café. Solo play and two-chef helpers are extras.</p><button class="btn" data-a="closeHelp">Got it</button>
    </div></div>`;

  // ---------- animation frame: timers & clock ----------
  let lastReady = null, lastSec = null, lastCount = null;
  function frame(once) {
    const g = game();
    if (g) {
      const now = g.paused ? g.paused.at : hostNow(); // a paused game shows frozen timers
      document.querySelectorAll('[data-pend]').forEach(el => { el.textContent = fmt(Math.max(0, +el.dataset.pend - hostNow())); });
      const dur = E.workerMs(g);
      document.querySelectorAll('[data-wstart]').forEach(el => {
        const left = Math.max(0, +el.dataset.wstart + dur - now);
        el.style.setProperty('--p', (left / dur).toFixed(3));
        el.classList.toggle('expired', left === 0);
        const s = el.querySelector('.sec'); if (s) s.textContent = left ? Math.ceil(left / 1000)+'s' : '✓';
      });
      document.querySelectorAll('[data-wpid]').forEach(el => {
        const ws = (g.workers[el.dataset.wpid] || []).filter(Boolean);

        el.style.setProperty('--p', (left / dur).toFixed(3));
      });

        el.classList.toggle('urgent', el.dataset.pclaim === '0' && age > PING_URGENT);

      document.querySelectorAll('[data-mend]').forEach(el => { el.textContent = `${Math.max(0, Math.ceil((+el.dataset.mend - now) / 1000))} s`; });
      document.querySelectorAll('[data-gend]').forEach(el => { el.textContent = `${Math.max(0, Math.ceil((+el.dataset.gend - now) / 1000))} s`; });
      const clock = document.getElementById('clock');
      const cd = document.getElementById('countdown');
      if (g.phase === 'play') {
        const pre = g.shiftStart - now;
        if (cd) { const n = pre > 0 ? Math.ceil(pre / 1000) : 0; cd.textContent = n || ''; cd.className = 'countdown' + (n ? ' on' : ''); if (n !== lastCount) { if (n) SFX.tap(); else if (lastCount) SFX.go(); lastCount = n; } }
        const left = g.shiftEnd - Math.max(now, g.shiftStart);
        if (clock) { clock.textContent = fmt(left); clock.classList.toggle('hurry', left < 30000 && !g.paused); clock.classList.toggle('paused', !!g.paused); }

      if (!once && meP && g.phase === 'play') {

        const started = now >= g.shiftStart;
        const key = nReady + '|' + started + '|' + E.workerReady(g, me.pid, now);

          lastReady = key;

  // ---------- Canggu: long-press anywhere on the plan sends a radar ping ----------
  function boardPoint(el, cx, cy) {
    const board = document.querySelector('.board');
    if (!board) return { x: 50, y: 50 };
    const r = board.getBoundingClientRect();
    if (cx == null) { const e = el.getBoundingClientRect(); cx = e.left + e.width / 2; cy = e.top + e.height / 2; }
    const sec = el && el.closest ? el.closest('section.area') : null;
    const area = sec ? ['reception', 'dining', 'green', 'stove', 'sink', 'cupboard'].find(c => sec.classList.contains(c)) || (sec.classList.contains('st1') ? 'storA' : sec.classList.contains('st2') ? 'storB' : sec.classList.contains('st3') ? 'storC' : null) : null;
    return { x: Math.round((cx - r.left) / r.width * 1000) / 10, y: Math.round((cy - r.top) / r.height * 1000) / 10, area: area === 'cupboard' ? null : area };
  }
  let lp = null, lpFired = 0;

        const cs = ui.cancelSheet; ui.cancelSheet = null;
        if (!g || !cs) { render(); break; }
        if (!act({ type: 'recall', owner: t.dataset.owner, t: Number(t.dataset.t), cancel: true })) { render(); break; }
        SFX.tap();
        if (cs.go) {
          if (cs.go.area === 'van') ui.shop = { ing: null, cheap: [], pricey: [] };
          ui.stations = false; ui.plates = false;
          if (act({ type: 'place', area: cs.go.area, idx: cs.go.idx })) { ui.detail = null; ui.stationOpen = ['storage','spice'].includes(myOpen(game())?.type); }
        }
        render();
        break;
      }
      case 'mate': ui.team=false; ui.mate = t.dataset.id; render(); break;
      case 'helpSel': ui.sel = +t.dataset.order; ui.mate = null; render(); break;
      case 'helpCook': if (g && act({ type: 'cook', order: +t.dataset.order })) { ui.mate = null; toast('🔥 Cooked for your partner'); render(); } break;
      case 'selMine': ui.sel = null; render(); break;
      case 'closeMate': ui.mate = null; render(); break;
      case 'latePay': if (g && act({ type: 'latePay', owner: t.dataset.owner, t: +t.dataset.t })) toast('⏳ The timer is back at work'); break;
      case 'officeCard': if (g && act({ type: 'officeCard', card: t.dataset.card })) toast(`${E.OFFICE[t.dataset.card].e} ${E.OFFICE[t.dataset.card].n} — done`); break;
      case 'buyIng': if (g && ui.shop.ing && act({ type: 'buy', kind: 'ing', ing: ui.shop.ing, room: t.dataset.room, ...(t.dataset.split!=null?{allocation:{A:Number(t.dataset.split),B:(E.has(g,'bulk')?7:5)-Number(t.dataset.split)}}:{}) })) { toast(`🚐 Bought ${E.has(g, 'bulk') ? 7 : 5} ${E.ING_INFO[ui.shop.ing].e}`); ui.shop = { ing: null, cheap: [], pricey: [], tab: null }; render(); } break;
      case 'shopSp': {
        const k = t.dataset.kind, n = k === 'cheap' ? 3 : 2;
        if (ui.shop.tab !== k) { ui.shop.tab = k; ui.shop.ing = null; ui.shop.cheap = []; ui.shop.pricey = []; }
        if (ui.shop[k].length < n) ui.shop[k].push(t.dataset.spice);
        render(); break;
      }
      case 'shopClear': ui.shop[t.dataset.kind] = []; render(); break;
      case 'buySp': {
        const k = t.dataset.kind, picks = ui.shop[k].slice();
        if (g && act({ type: 'buy', kind: k, spices: picks })) { toast(`🚐 Bought ${picks.map(x => E.SP_INFO[x].e).join('')}`); ui.shop = { ing: null, cheap: [], pricey: [], tab: null }; render(); }
        break;
      }
      case 'endNow': if (isHost() && g && confirm('End the shift now and check the meals?')) { E.apply(g, { type: 'endNow' }, Date.now()); ui.menu = false; changed(); } break;
      case 'log': downloadLog(); break;
      case 'guests': ui.guests=!ui.guests; render(); break;
      case 'inspectGuest': ui.guests=true; ui.guestSeat=Number(t.dataset.seat); render(); break;
      case 'finishShift': if(isHost()&&g&&confirm('Finish all ongoing actions and check everyone’s meals?')){E.apply(g,{type:'finishShift'},Date.now());hostTick();changed();} break;
      case 'seatVisit': {const idx=g.spaces.dining.findIndex(x=>!x);if(idx<0){toast('All dining spaces are occupied.','err');break;}act({type:'place',area:'dining',idx});break;}
      case 'hideResults': ui.results = false; render(); break;
      case 'showResults': ui.results = true; render(); break;
      case 'place': {
        if (!g) return;
        const area = t.dataset.area, idx = +t.dataset.idx;
        // Canggu: tapping your own busy chef, or a free space while every chef is busy, offers to cancel.
        { const now = hostNow(), occ = area === 'van' ? null : (g.spaces[area] || [])[idx];
          if (g.phase === 'play' && !g.paused && now >= g.shiftStart && now < g.shiftEnd) {
            const run = runningChefs(g, now);
            const own = occ && run.find(x => x.owner === occ.pid && x.t === occ.t);
            if (own) { ui.cancelSheet = { only: { owner: own.owner, t: own.t } }; render(); break; }
            if (!occ && run.length && !E.workerReady(g, me.pid, now)) { ui.cancelSheet = { go: { area, idx } }; render(); break; }
          } }
        if (area === 'van') ui.shop = { ing: null, cheap: [], pricey: [] };
        ui.stations=false; ui.plates=false;
        if (act({ type: 'place', area, idx })) { SFX.tap(); ui.detail=null;ui.stationOpen=['storage','spice'].includes(myOpen(game())?.type);render(); }
        break;
      }
      case 'takeOrder': {
        if (!g) return;
        const op = myOpen(g);
        if (!op || op.type !== 'order') { ui.seatPeek = +t.dataset.seat; render(); break; }
        if (act({ type: 'takeOrder', seat: +t.dataset.seat })) SFX.pick();
        break;
      }
      case 'closeSeat': ui.seatPeek = null; render(); break;
      case 'plateMenu': ui.detail=null;ui.stationOpen=false;ui.plateMenu = true; render(); break;
      case 'closePlates': ui.plateMenu = false; render(); break;
      case 'washMenu': { const op = g && myOpen(g); if (op && op.type === 'wash') ui.washHide = null; else ui.washMenu = true; render(); break; }
      case 'closeWash': ui.washMenu = false; render(); break;
      case 'hideWash': ui.washHide = +t.dataset.start; ui.washMenu = false; render(); break;
      case 'hideOrders': ui.orderHide = +t.dataset.start; render(); break;
      case 'showOrders': ui.orderHide = null; render(); break;
      case 'stations': ui.stations=!ui.stations; render(); break;
      case 'plates': ui.plates=!ui.plates; render(); break;
      case 'closeTray': ui.plates=false; render(); break;
      case 'plate': {
        if (!g) return;
        const mine = g.orders.filter(o => o.pid === me.pid);
        const open = mine.filter(o => !o.parked && !o.served);
        const target = open.find(o => o.id === (t.dataset.order ? +t.dataset.order : ui.sel));
        if (!target) { shake(t); toast('Select your order before taking a plate.', 'err'); return; }
        { const r = t.getBoundingClientRect(); ui.sel = target.id; ui.bump = { order: target.id, k: 'plate', t: Date.now() };
          picked(t, r, 'plate', target.id, 'plate', act({ type: 'takePlate', order: target.id, size: t.dataset.size })); }
        break;
      }
      case 'takeIng': {
        if (!g) return;
        const op = myOpen(g);
        if (!op || op.type !== 'storage') { if (!act({ type: 'takeIng', order: ui.sel || 0, ing: t.dataset.ing })) shake(t); return; } // the engine explains why
        if (op.room !== t.dataset.room) { shake(t); toast(`Your chef is in storage room ${op.room === 'A' ? 1 : 2}.`, 'err'); return; }
        if (!ui.sel) { shake(t); toast('Take an order first — ingredients only go on your own plates.', 'err'); return; }
        { const r = t.getBoundingClientRect(), order = ui.sel; ui.bump = { order, k: t.dataset.ing, t: Date.now() };
          picked(t, r, t.dataset.ing, order, t.dataset.ing, act({ type: 'takeIng', order, ing: t.dataset.ing })); }
        break;
      }
      case 'sel': ui.sel = +t.dataset.order; render(); break;
      case 'inspectOrder': ui.sel=+t.dataset.order;ui.detail=ui.sel;ui.stationOpen=false;render();break;
      case 'closeOrder': ui.detail=null;ui.stationOpen=false;render();break;
      case 'openStation': ui.detail=null;ui.stationOpen=true;render();break;
      case 'takeSpice': {
        if (!g) return;
        const op = myOpen(g);
        if (!op || op.type !== 'spice') { if (!act({ type: 'takeSpice', order: ui.sel || 0, spice: t.dataset.spice })) shake(t); return; }
        if (!ui.sel) { shake(t); toast('Take an order first — spices only go on your own plates.', 'err'); return; }
        { const r = t.getBoundingClientRect(), order = ui.sel; ui.bump = { order, k: t.dataset.spice, t: Date.now() };
          picked(t, r, t.dataset.spice, order, t.dataset.spice, act({ type: 'takeSpice', order, spice: t.dataset.spice })); }
        break;
      }
      case 'wash': {
        if (!g) return;
        const op = myOpen(g);
        if (!op || op.type !== 'wash') { shake(t); toast('Send a chef to the wash station first.', 'err'); return; }
        { const r = t.getBoundingClientRect(); ui.washed = { size: t.dataset.size, t: Date.now() };
          if (act({ type: 'wash', size: t.dataset.size })) { SFX.pick(); const to = document.querySelector(`.cupboard [data-size="${t.dataset.size}"]`); if (to) washFx(r, to); } else shake(t); }
        break;
      }
      case 'bin': {
        e.stopPropagation();
        const order = +t.dataset.order;
        if (ui.armedBin && ui.armedBin.order === order && Date.now() - ui.armedBin.t < 4000) {
          ui.armedBin = null;
          if (act({ type: 'discard', order })) toast('🗑️ Binned — the plate went to the sink.');
        } else { ui.armedBin = { order, t: Date.now() }; ui.sel = order; render(); setTimeout(render, 4100); }
        return;
      }
      case 'ret': {
        e.stopPropagation();
        const order = +t.dataset.order, ing = t.dataset.ing;
        if (ui.armed && ui.armed.order === order && ui.armed.ing === ing && Date.now() - ui.armed.t < 4000) {
          ui.armed = null;
          if (act({ type: 'returnIng', order, ing })) toast(`${E.ING_INFO[ing].e} put back`);
        } else {
          ui.armed = { order, ing, t: Date.now() };
          ui.sel = order;
          toast(`Tap ${E.ING_INFO[ing].e} again to put it back`);
          render();
        }
        return;
      }
      case 'cook': e.stopPropagation(); if (g) act({ type: 'cook', order: +t.dataset.order }); return;
      case 'done': if (g) act({ type: 'done' }); break;
    }
  });

  // ?room=MANGO42 in the address fills in the join code
  const qRoom = new URLSearchParams(location.search).get('room');
  if (qRoom) LS.set('kc-guest', { room: qRoom.toUpperCase(), at: Date.now() });

  const E_NET = window.Net;
  if (DEV) window.__kc = { get wrap() { return wrap; }, get auth() { return authWrap; }, get role() { return role; }, get net() { return net; }, get pending() { return pending; }, me };
  if(DEV) Object.assign(window.__kc, {render, act, ui, loadScenario(n,count=4){
    role='solo';room='DESIGN';ui.screen='game';ui.results=false;ui.team=false;ui.mate=null;ui.sel=null;
    const players=Array.from({length:count},(_,i)=>({id:i===0?me.pid:'qa'+i,name:['Luca','Maya','Priya','Alex'][i],color:['yellow','blue','red','green'][i]}));
    me.name='Luca';me.color='yellow';wrap={room,rev:1,lobby:{players,settings:{scenario:n,workerSec:30,shiftSec:240,strict:true}},game:null};wrap.game=E.newGame(wrap.lobby.settings,players);render();return wrap.game;
  }});
  render();
  // After a reload (Safari drops pages it hasn't shown for a while), go straight back into the game
  // this iPad was in most recently: hosting it or playing in it.
  const back = LS.get('kc-guest', null), hsave = LS.get('kc-host', null);
  const hostOk = !qRoom && hsave && hsave.pid === me.pid && hsave.wrap && Date.now() - hsave.savedAt < 3 * 3600e3;
  const guestOk = !qRoom && back && me.name && Date.now() - back.at < 3 * 3600e3;
  if (hostOk && (!guestOk || hsave.savedAt >= back.at)) hostStart(hsave);
  else if (guestOk) guestJoin(back.room);
})();

</script>
