<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f5efdf">
<title>Canggu Kitchen · Canggu edition (beta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
<style>
:root {
  --tile: #CFE6DE;
  --grout: #E8F4EF;
  --ink: #1D2A44;
  --ink-2: #4A5874;
  --paper: #FFFCF2;
  --counter: #F7FAF9;
  --steel: #A9BAC4;
  --heat: #FF5533;
  --ok: #1F9D63;
  --bad: #D93A3A;
  --lift: 0 3px 0 rgba(29, 42, 68, .22);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: 'Fredoka', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
  color: var(--ink);
  background-color: var(--tile);
  background-image:
    linear-gradient(var(--grout) 2px, transparent 2px),
    linear-gradient(90deg, var(--grout) 2px, transparent 2px);
  background-size: 56px 56px;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--heat); outline-offset: 2px; }
input { font: inherit; -webkit-user-select: text; user-select: text; }
h1, h2, h3 { margin: 0; font-weight: 600; }

/* ---------- shared ---------- */
.logo { font-size: clamp(44px, 8vw, 84px); font-weight: 700; letter-spacing: -.02em; line-height: 1; color: var(--ink); text-shadow: 0 4px 0 #fff; }
.logo span { color: var(--heat); }
.logo.small { font-size: 40px; }
.sub { color: var(--ink-2); margin: 8px 0 0; font-size: 18px; }
.card { background: var(--paper); border: 2.5px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); padding: 24px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--heat); color: #fff; font-weight: 600; font-size: 18px; box-shadow: var(--lift); }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.big { min-height: 60px; font-size: 22px; padding: 0 30px; }
.btn.ghost { background: #fff; color: var(--ink); }
.btn:disabled { opacity: .45; }
.link { background: none; border: 0; color: var(--ink-2); text-decoration: underline; font-size: 17px; padding: 10px; }
.note { color: var(--ink-2); }
.dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); vertical-align: -1px; margin-right: 8px; }

/* ---------- home & lobby ---------- */
.home, .lobby { max-width: 860px; margin: 0 auto; padding: 48px 20px; text-align: center; }
.homecard { margin-top: 28px; text-align: left; }
.fld { display: block; font-weight: 600; margin-bottom: 18px; font-size: 18px; }
.fld input { display: block; width: 100%; margin-top: 8px; font-size: 22px; padding: 12px 16px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; }
.colors { display: flex; gap: 14px; margin-top: 8px; }
.cbtn { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--ink); background: var(--c); box-shadow: var(--lift); }
.cbtn.on { outline: 4px solid var(--c); outline-offset: 4px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 6px; }
.half { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; padding: 18px; border-radius: 14px; background: var(--counter); border: 2px dashed var(--steel); }
.half p { margin: 0; color: var(--ink-2); }
.codein { width: 100%; font-size: 28px; letter-spacing: .08em; padding: 10px 14px; border: 2.5px solid var(--ink); border-radius: 12px; text-transform: uppercase; font-weight: 600; }
.lobby .card { margin-top: 20px; text-align: left; }
.lobby h2 { margin: 22px 0 10px; font-size: 22px; }
.roomcode { font-size: clamp(56px, 11vw, 96px); font-weight: 700; letter-spacing: .06em; text-align: center; color: var(--heat); line-height: 1.1; margin: 4px 0 6px; }
.plist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.plist li { display: flex; align-items: center; font-size: 22px; padding: 10px 14px; background: #fff; border: 2px solid var(--ink); border-radius: 12px; }
.plist em { margin-left: 10px; font-style: normal; color: var(--ink-2); font-size: 16px; }
.plist em.on { color: var(--ok); }
.plist em.off { color: var(--bad); }
h2 small, h2 .extra { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 6px; }
.plist .x { margin-left: auto; background: none; border: 0; font-size: 22px; padding: 4px 10px; }
.setrow { display: flex; align-items: center; gap: 14px; margin: 10px 0; flex-wrap: wrap; }
.setrow > span { width: 130px; font-weight: 600; }
.seg { display: inline-flex; border: 2.5px solid var(--ink); border-radius: 999px; overflow: hidden; background: #fff; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 10px 16px; font-size: 17px; min-height: 44px; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.on { background: var(--ink); color: #fff; }
.seg button:disabled { color: var(--ink); }
.seg button.on:disabled { color: #fff; }
.lobby .btn.big { margin-top: 24px; width: 100%; }
.lobbylinks { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }

/* ---------- game layout ---------- */
.game { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: var(--ink); color: #fff; flex: none; }
.brand { font-weight: 700; font-size: 22px; white-space: nowrap; }
.brand span { color: var(--heat); }
.brand small { font-weight: 500; font-size: 14px; opacity: .7; margin-left: 6px; letter-spacing: .05em; }
.clock { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 96px; text-align: center; background: var(--paper); color: var(--ink); border-radius: 10px; padding: 0 12px; line-height: 44px; }
.clock.hurry { background: var(--heat); color: #fff; }
.who { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.pchip { --p: 0; padding: 4px 12px 4px 10px; border-radius: 999px; font-weight: 600; font-size: 16px; background: linear-gradient(90deg, var(--c) calc(var(--p) * 100%), rgba(255,255,255,.14) 0); border: 2px solid var(--c); }
.net { font-size: 14px; }
.net.bad { background: var(--bad); padding: 4px 10px; border-radius: 8px; }
.menu-b { background: none; border: 2px solid rgba(255,255,255,.5); color: #fff; border-radius: 10px; width: 46px; height: 42px; font-size: 22px; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(330px, 1fr); gap: 12px; padding: 12px; }
.board { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: auto auto auto; gap: 10px; align-content: start; overflow: auto; }
.area { background: var(--counter); border: 2.5px solid var(--ink); border-radius: 14px; padding: 8px 10px 10px; box-shadow: var(--lift); min-width: 0; }
.area h3 { font-size: 16px; margin-bottom: 6px; color: var(--ink-2); font-weight: 600; }
.area h3 small { font-weight: 400; }
.area.active { background: #FFF1D6; border-color: var(--heat); }
.reception { grid-area: rec; }
.dining { grid-area: din; display: flex; flex-direction: column; }
.st1 { grid-area: st1; } .st2 { grid-area: st2; }
.stove { grid-area: stove; } .cupboard { grid-area: cup; }
.area.green { grid-area: green; } .area.sink { grid-area: sink; }
.board.scen-1 { grid-template-areas: "rec din din" "st1 din din" "st2 stove cup"; }
.board.scen-2 { grid-template-areas: "rec din din" "green din din" "st1 st2 stove" "cup cup stove"; }
.board.scen-3 { grid-template-areas: "rec din din" "green din din" "st1 st2 stove" "sink cup cup"; }

/* action spaces: the sand timers */
.spots { display: flex; flex-wrap: wrap; gap: 8px; }
.spot { --p: 0; position: relative; width: 58px; height: 58px; border-radius: 50%; border: 3px dashed var(--steel); background: #fff; display: grid; place-items: center; font-size: 24px; padding: 0; }
.spot:active { transform: scale(.94); }
.spot.taken { border: 3px solid var(--ink); background: conic-gradient(var(--c) calc(var(--p) * 360deg), color-mix(in srgb, var(--c) 25%, #fff) 0); }
.spot.taken .ini { position: relative; z-index: 1; width: 34px; height: 34px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: var(--ink); }
.spot .sec { position: absolute; bottom: -4px; right: -6px; font-style: normal; font-size: 13px; font-weight: 700; background: var(--ink); color: #fff; border-radius: 8px; padding: 0 5px; min-width: 20px; }
.spot .sec:empty { display: none; }
.spot.taken.expired { background: color-mix(in srgb, var(--c) 30%, #fff); }
.spot.mine.expired { animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 45%, transparent); } }

.queue { display: flex; align-items: center; gap: 18px; margin-top: 10px; }
.queue p { margin: 0; font-size: 15px; color: var(--ink-2); }
.stack { width: 40px; height: 52px; border-radius: 6px; background: var(--heat); border: 2px solid var(--ink); box-shadow: calc(var(--n) * 2px) calc(var(--n) * 2px) 0 #fff, calc(var(--n) * 2px + 2px) calc(var(--n) * 2px + 2px) 0 var(--ink); flex: none; }

/* seats & order tickets */
.seats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; margin-bottom: 10px; }
.seat { min-height: 92px; border-radius: 8px; border: 2px dashed var(--steel); background: transparent; }
.seat.reserved { display: grid; place-items: center; color: var(--steel); font-weight: 600; background: repeating-linear-gradient(-45deg, transparent 0 8px, rgba(169,186,196,.18) 8px 16px); }
.seat.guest { border: 2px solid var(--ink); background: var(--paper); display: flex; flex-direction: column; align-items: flex-start; padding: 8px; text-align: left; box-shadow: var(--lift); }
.seat.guest.glow { border-color: var(--heat); box-shadow: 0 0 0 4px rgba(255,85,51,.35), var(--lift); }
.mt-e { font-size: 26px; line-height: 1; }
.mt-n { font-weight: 600; font-size: 15px; line-height: 1.15; margin: 3px 0 4px; }
.mt-r { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 15px; }
.pl { display: inline-grid; place-items: center; border-radius: 50%; border: 2px solid var(--ink); background: #fff; font-weight: 700; font-size: 11px; color: var(--ink); box-shadow: inset 0 0 0 3px #E4ECEF; flex: none; }
.pl-S { width: 22px; height: 22px; } .pl-M { width: 27px; height: 27px; } .pl-L { width: 32px; height: 32px; } .pl-XL { width: 37px; height: 37px; }
.pl.big.pl-S { width: 30px; height: 30px; } .pl.big.pl-M { width: 38px; height: 38px; } .pl.big.pl-L { width: 46px; height: 46px; } .pl.big.pl-XL { width: 54px; height: 54px; }
.pl.big { font-size: 14px; }
.pot { display: inline-flex; align-items: center; gap: 1px; font-size: 15px; }
.pot b { font-size: 15px; }

/* storage, stove, cupboard */
.ings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.ing { display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 46px; border-radius: 10px; border: 2px solid var(--ink); background: #fff; font-size: 22px; padding: 0 4px; }
.ing b { font-size: 16px; }
.ing:disabled { opacity: .35; }
.ing.glow { background: #FFE2B8; box-shadow: var(--lift); }
.ing:active:not(:disabled) { transform: translateY(2px); }
.plates { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; }
.pbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 2px solid transparent; border-radius: 10px; padding: 4px 6px; }
.pbtn b { font-size: 14px; }
.pbtn:disabled { opacity: .35; }
.pbtn.glow { border-color: var(--heat); background: #FFE2B8; }

/* my kitchen */
.kitchen { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; }
.me { display: flex; gap: 12px; align-items: center; background: var(--ink); color: #fff; border-radius: 14px; padding: 10px 12px; flex: none; }
.glass { --p: 0; position: relative; width: 66px; height: 66px; border-radius: 50%; flex: none; border: 3px solid #fff; background: conic-gradient(var(--c) calc(var(--p) * 360deg), rgba(255,255,255,.12) 0); display: grid; place-items: center; }
.glass .hg { font-size: 28px; }
.glass .sec { position: absolute; bottom: -6px; right: -6px; font-style: normal; font-weight: 700; background: var(--heat); border-radius: 10px; padding: 0 6px; font-size: 15px; }
.glass .sec:empty { display: none; }
.glass.free, .glass.expired { background: var(--c); }
.prompt { flex: 1; display: flex; align-items: center; gap: 10px; }
.prompt p { margin: 0; font-size: 17px; line-height: 1.3; flex: 1; }
.prompt .btn { flex: none; }
.mytks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.empty-k { margin: 0; padding: 16px; border: 2px dashed var(--ink-2); border-radius: 12px; color: var(--ink-2); background: rgba(255,255,255,.5); font-size: 17px; grid-column: 1 / -1; }
.ticket { position: relative; background: var(--paper); border: 2px solid var(--ink); border-radius: 4px 4px 10px 10px; padding: 12px 10px 10px; box-shadow: var(--lift); }
.ticket::before { content: ''; position: absolute; left: -2px; right: -2px; top: -2px; height: 8px; background: radial-gradient(circle at 6px 0, var(--tile) 5px, transparent 5.5px) 0 0 / 12px 8px repeat-x; }
.ticket.sel { border-color: var(--heat); box-shadow: 0 0 0 3px rgba(255,85,51,.4), var(--lift); }
.ticket.cookable { border-color: var(--heat); }
.tk-head { display: flex; align-items: center; gap: 6px; }
.tk-e { font-size: 28px; line-height: 1; }
.tk-n { font-weight: 600; font-size: 17px; line-height: 1.1; }
.tk-tag { margin-left: auto; font-size: 12px; background: var(--heat); color: #fff; border-radius: 6px; padding: 1px 6px; }
.tk-need { display: flex; align-items: center; gap: 8px; margin: 8px 0; padding-bottom: 8px; border-bottom: 2px dotted var(--steel); font-size: 18px; }
.tk-plate { display: flex; align-items: center; gap: 8px; min-height: 56px; }
.noplate { font-size: 14px; color: var(--ink-2); border: 2px dashed var(--steel); border-radius: 999px; padding: 6px 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 2px solid var(--ink); background: #fff; font-size: 20px; padding: 0; }
.chip.armed { background: var(--bad); border-color: var(--bad); animation: wiggle .4s ease-in-out infinite; }
@keyframes wiggle { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
.tk-cook { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.cells { display: inline-flex; gap: 3px; }
.cells i { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--steel); background: #fff; }
.cells i.goal { border-color: var(--ink); }
.cells i.on { background: var(--heat); border-color: var(--ink); }
.cells i.over { background: var(--bad); }
.ct { font-size: 14px; color: var(--ink-2); }
.cookbtn { width: 100%; margin-top: 10px; min-height: 48px; }
.others { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
.other { border-left: 6px solid var(--c); background: rgba(255,255,255,.55); border-radius: 10px; padding: 8px 10px; }
.oname { font-weight: 600; font-size: 16px; margin-bottom: 6px; }
.oname small { font-weight: 400; color: var(--ink-2); }
.otks { display: flex; gap: 6px; overflow-x: auto; }
.otks .ticket { min-width: 150px; padding: 8px; transform: none; font-size: 90%; }
.otks .ticket .tk-plate { min-height: 36px; }
.otks .ticket .tk-e { font-size: 20px; }
.otks .ticket .tk-n { font-size: 14px; }
.otks .ticket .chip { width: 28px; height: 28px; font-size: 15px; }
.none { color: var(--ink-2); font-size: 14px; }

/* overlays */
.sheet { position: fixed; inset: 0; background: rgba(29,42,68,.55); display: grid; place-items: center; padding: 20px; z-index: 20; overflow: auto; }
.sheet .card { max-width: 760px; width: 100%; }
.sheet h2 { font-size: 28px; margin-bottom: 10px; }
.sheet p { font-size: 18px; line-height: 1.45; }
.readysheet { background: rgba(29,42,68,.35); place-items: end center; }
.readysheet .card { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.help ul { padding-left: 0; list-style: none; font-size: 17px; line-height: 1.45; }
.help li { margin: 8px 0; }
.menu { max-width: 380px !important; display: flex; flex-direction: column; gap: 10px; }
.results.won h2 { color: var(--ok); }
.results.lost h2 { color: var(--bad); }
.rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 16px 0; }
.rcol { border-top: 6px solid var(--c); background: #fff; border-radius: 10px; padding: 10px; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
.rcol h3 { font-size: 19px; display: flex; align-items: center; margin-bottom: 8px; }
.rcol h3 span { margin-left: auto; font-size: 16px; color: var(--ink-2); }
.rrow { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px dotted var(--steel); }
.rrow .re { font-size: 24px; }
.rrow div { flex: 1; display: flex; flex-direction: column; }
.rrow small { color: var(--ink-2); font-size: 13px; }
.rrow .mark { font-size: 22px; font-weight: 700; }
.rrow.ok .mark { color: var(--ok); }
.rrow.bad .mark { color: var(--bad); }
.acts { margin: 8px 0 0; font-size: 14px !important; color: var(--ink-2); }
.rbtns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.countdown { position: fixed; inset: 0; display: none; place-items: center; font-size: 220px; font-weight: 700; color: #fff; text-shadow: 0 8px 0 var(--ink); background: rgba(255,85,51,.75); z-index: 30; pointer-events: none; }
.countdown.on { display: grid; }
.phase-ready .main, .phase-results .main { filter: saturate(.85); }

#toast { position: fixed; left: 50%; top: 70px; transform: translate(-50%, -20px); opacity: 0; background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 14px; font-size: 18px; font-weight: 500; z-index: 50; transition: opacity .2s, transform .2s; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.err { background: var(--bad); }

/* portrait iPad / phone */
@media (orientation: portrait), (max-width: 900px) {
  .game { height: auto; min-height: 100dvh; }
  .main { grid-template-columns: 1fr; }
  .kitchen { overflow: visible; }
  .split { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .board { grid-template-columns: 1fr 1fr; }
  .board.scen-1 { grid-template-areas: "rec st1" "din din" "st2 stove" "cup cup"; }
  .board.scen-2 { grid-template-areas: "rec green" "din din" "st1 st2" "stove cup"; }
  .board.scen-3 { grid-template-areas: "rec green" "din din" "st1 st2" "stove cup" "sink sink"; }
  .who { display: none; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .spot.mine.expired, .chip.armed { animation: none; }
  #toast { transition: none; }
}

/* ---------- kid-friendly helpers ---------- */
.hint { display: block; margin-top: 4px; color: #FFD27A; font-size: 15px; }
.ni { display: inline-block; position: relative; }
.ni.got::after { content: '✓'; position: absolute; right: -4px; bottom: -6px; font-size: 11px; font-weight: 700; color: #fff; background: var(--ok); border-radius: 50%; width: 14px; height: 14px; line-height: 14px; text-align: center; }
.pl.got { background: #DDF3E7; box-shadow: inset 0 0 0 3px #B5E2C9; }
.glass.go { animation: ready 1.2s ease-in-out infinite; }
@keyframes ready { 50% { box-shadow: 0 0 0 8px rgba(255,255,255,.35); } }
@media (prefers-reduced-motion: reduce) { .glass.go { animation: none; } }

/* Safari's tab bar leaves ~740 px in landscape: tighten the board */
@media (orientation: landscape) and (max-height: 780px) {
  .bar { padding: 6px 12px; }
  .clock { font-size: 30px; line-height: 40px; }
  .main { gap: 10px; padding: 8px 10px; }
  .board { gap: 8px; }
  .area { padding: 6px 8px 8px; }
  .area h3 { font-size: 15px; margin-bottom: 4px; }
  .spot { width: 52px; height: 52px; font-size: 21px; }
  .spot.taken .ini { width: 30px; height: 30px; font-size: 16px; }
  .ing { min-height: 40px; font-size: 20px; }
  .ings { margin-top: 6px; gap: 5px; }
  .seat { min-height: 84px; }
  .queue { margin-top: 6px; }
  .stack { width: 34px; height: 44px; }
  .glass { width: 58px; height: 58px; }
}

/* ---------- scenarios 2 & 3 ---------- */
.rc { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.rc .queue { margin-top: 0; }
.gh { display: flex; flex-direction: column; gap: 6px; }

.solocard p { margin: 0; color: var(--ink-2); }
.solocard .btn { flex: none; }
.cprog { height: 14px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; overflow: hidden; margin: 10px 0 4px; }
.cprog div { height: 100%; background: var(--ok); }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.ccard { position: relative; text-align: left; background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; padding: 10px 12px 10px 44px; display: flex; flex-direction: column; gap: 2px; min-height: 76px; box-shadow: var(--lift); }
.ccard b { font-size: 16px; font-weight: 600; }
.ccard small { font-size: 13px; color: var(--ink-2); line-height: 1.25; }
.ccard .cst { position: absolute; left: 10px; top: 10px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; background: var(--tile); }
.ccard.won .cst { background: var(--ok); color: #fff; }
.ccard.on { background: var(--ink); color: #fff; }
.ccard.on small { color: #DCE3EE; }
.ccard.locked { opacity: .5; box-shadow: none; }
.ccard:disabled { color: var(--ink); cursor: default; }
@media (max-width: 640px) { .solocard { flex-direction: column; align-items: flex-start; } }
.resumebtn { width: 100%; margin: 6px 0 14px; }

/* two-chef rules */
.duonote { background: #E9F3FF; border-radius: 10px; padding: 8px 12px; color: var(--ink); }
.badge { font-size: 13px; font-weight: 600; background: var(--heat); color: #fff; border-radius: 8px; padding: 2px 8px; vertical-align: middle; }
.forpartner { grid-column: 1 / -1; border: 2px dashed var(--heat); border-radius: 12px; padding: 6px; background: #FFF5E8; }
.fpband { font-size: 14px; font-weight: 600; margin: 0 0 6px 4px; display: flex; align-items: center; gap: 8px; }
.fpband .link { padding: 0; font-size: 13px; }
.forpartner .ticket { max-width: 260px; }
.helpwrap { display: flex; flex-direction: column; gap: 6px; }
.helpwrap .btn { min-height: 42px; font-size: 15px; }
.tempbar small { font-size: 11px; opacity: .85; margin-right: 2px; }
@media (max-width: 1100px) {
  .bar.crowded { gap: 6px; padding: 4px 8px; }
  .bar.crowded .tempbar small, .bar.crowded .officebar small, .bar.crowded .brand { display: none; }
  .bar.crowded .clock { min-width: 80px; font-size: 28px; padding: 0 8px; }
  .bar.crowded .goalchip small { font-size: 12px; }
  .bar.crowded .vanbtn span small { display: none; }
}

        storage.C = { cheese: 0, meat: 0, bread: t(3, 4, 5), salad: 0, veg: 0, pasta: t(3, 4, 5) };
      } else {
        storage.A = { cheese: a, meat: b, bread: a, salad: a, veg: b, pasta: a }; storage.B = Object.assign({}, storage.A);
      }
      bag = fill(SPICES, t(1, 2, 3));
      cupboard = { S: t(2, 3, 4), M: t(2, 3, 4), L: t(2, 3, 4), XL: t(1, 1, 2) };
      dirty = { S: 1, M: 1, L: 1, XL: 1 };
    }
    if (cfg.mission === 4) { Object.values(storage).forEach(r => ING.forEach(i => { r[i] = 0; })); SPICES.forEach(i => { bag[i] = 0; }); }

    const spaces = {
      reception: [null],
      dining: Array(L.dining).fill(null),
      storA: [null, null],
      storB: [null, null],
      stove: Array(L.stove).fill(null),
    };
    if (cfg.spices) spaces.green = [null, null];
    if (cfg.sink) spaces.sink = [null, null];
    if (storage.C) spaces.storC = [null, null];
    if (cfg.shop) spaces.van = [];
    if (cfg.office) spaces.office = [null];

    let deck = FRIENDS.slice();
    if (n >= 2) deck = deck.concat(REGULARS);
    if (cfg.challenging) deck = deck.concat(CHALLENGING);
    if (cfg.vip) deck = deck.concat(VIPS);

    const s = {
      v: 3,
      phase: 'ready',
      settings: st,
      goal: goalOf(n, players.length, st.challenge && !cfg.mission),
      players: players.map(x => ({ id: x.id, name: x.name, color: x.color })),
      deck: shuffle(deck),
      discard: [],
      seats,
      spaces,
      storage,
      locked: cfg.locked ? { B: true } : {},
      broken: cfg.broken ? { area: 'stove', idx: spaces.stove.length - 1 } : null,
      bag,
      cupboard,
      dirty,
      officePlates: cfg.officeCards ? { S: 1, M: 1, L: 1, XL: 1 } : null,
      officeDeck: null,
      officeOpen: [],
      coins: cfg.money ? 2 : 0,
      rep: 0,
      awards: [],
      awardDeck: cfg.awards ? shuffle(Object.keys(AWARDS)) : [],
      drinkCoins: 0, shopCoins: 0, tipCoins: 0, officeCoins: 0,
      shift: 1,
      shifts: cfg.shifts,
      reports: [],
      shift0: null,
      led: {},
      feed: [],
      orders: [],
      workers: {},
      off: {},
      open: {},
      errs: {},
      stats: {},
      nextOrder: 1,
      shiftStart: null,
      shiftEnd: null,
      graceEnd: null,
      goalAt: null,
      results: null,
    };
    if (cfg.officeCards) {
      s.officeDeck = shuffle(Object.keys(OFFICE).filter(k => !(cfg.mission === 4 && k === 'locksmith')));
      s.officeOpen = s.officeDeck.splice(0, 2);
    }
    s.players.forEach(x => {
      s.workers[x.id] = Array(cfg.timers).fill(null);
      s.off[x.id] = Array(cfg.timers).fill(false);
      if (cfg.mission === 2) s.off[x.id][1] = true; // second timer starts on strike
      s.stats[x.id] = { actions: 0, byArea: {}, returned: 0, thrown: 0 };
    });
    if (cfg.temps) { s.workers.temp = Array(cfg.temps).fill(null); s.off.temp = Array(cfg.temps).fill(false); }
    // Two-chef helpers: an extra outside the rulebook, only when switched on in the lobby with exactly 2 chefs:
    //  1. a shared helper timer either chef can use (inspired by the original edition's neutral Helper),
    //  2. chefs may put ingredients and spices on, and cook, their partner's meals,
    //  3. a van trip allows two purchases.
    s.duo = !!st.duo && s.players.length === 2;
    if (s.duo) { s.workers.helper = [null]; s.off.helper = [false]; }
    markShiftStart(s);
    seatPatrons(s, 2, { setup: true });
    return s;
  }

  function markShiftStart(s) {
    s.shift0 = { coins: s.coins, drinks: s.drinkCoins, shop: s.shopCoins, tips: s.tipCoins, office: s.officeCoins, rep: s.rep, early: {} };
    // Per-chef ledger for this shift: who brought coins and reputation in, and who cost them.
    s.led = {};
    s.players.forEach(p => { s.led[p.id] = { seated: 0, drinks: 0, thrown: 0, tips: 0, early: 0, shop: 0, office: 0, binned: 0 }; });
  }
  const L = (s, pid) => s.led[pid] || (s.led[pid] = { seated: 0, drinks: 0, thrown: 0, tips: 0, early: 0, shop: 0, office: 0, binned: 0 });

  // Recent moves, so every iPad can see what the others are doing. Consecutive taps of the same
  // kind (ingredients, spices, washing) are merged into one line.
  const FEED_MAX = 14;
  function feed(s, now, pid, k, d) {
    const last = s.feed[s.feed.length - 1];
    if (last && last.pid === pid && last.k === k && (k === 'ing' || k === 'spice' || k === 'wash') && last.o === (d && d.o) && now - last.t < 20000) {
      if (d.item) last.items.push(d.item);
      last.t = now;
      return;
    }
    s.feed.push(Object.assign({ t: now, pid, k }, d, d && d.item ? { items: [d.item] } : {}));
    if (s.feed.length > FEED_MAX) s.feed.shift();
  }

  const has = (s, award) => s.awards.includes(award);
  const workerMs = s => { const base = s.settings.workerSec * 1000; return has(s, 'quick') ? Math.max(Math.min(base, 5000), base - 5000) : base; };

  function seatPatrons(s, max, opts) {
    opts = opts || {};
    let n = 0, extra = 0;
    for (let i = 0; i < s.seats.length && n < max && s.deck.length; i++) {
      const seat = s.seats[i];
      if (!seat.reserved && !seat.dish) {
        const next = s.deck.pop();
        if (isGroup(next)) {
          // Canggu: a birthday party or an influencer takes one table and orders several dishes.
          const m = momentOf(s, +next.slice(GROUP.length));
          if (!m || m.state !== 'queued') { i--; continue; }
          seatGroup(s, seat, m, opts.now || 0);
          extra += m.dishes.length - 1;
        } else seat.dish = next;
        n++;
      }
    }
    if (!opts.setup && !opts.noDrinks && cfgOf(s).money) {
      const c = (n + extra) * (has(s, 'drinks') ? 2 : 1); // every new guest buys a drink (a group: one each)
      s.coins += c; s.drinkCoins += c;
      if (opts.by) L(s, opts.by).drinks += c;
    }
    if (opts.by) L(s, opts.by).seated += n;
    return n;
  }

  // From restaurant 6 the reception asks: seat new guests, or send 1–2 waiting guests away.
  // Placing a timer there means seating guests (rulebook), so a chef who walks away without
  // choosing still seats them.
  function settleReception(s, pid, now) {
    const op = s.open[pid];
    if (!op || op.type !== 'reception') return;
    const k = seatPatrons(s, has(s, 'seats') ? 3 : 2, { by: pid, now });
    s.open[pid] = null;
    if (k) feed(s, now, pid, 'seat', { n: k });
  }

  // ---- timers ----
  const timerReady = (s, w, now) => !w || now >= w.start + workerMs(s);
  const ownersFor = (s, pid) => [pid].concat(s.workers.helper ? ['helper'] : [], s.workers.temp ? ['temp'] : []);
  function usable(s, owner, now) {
    return (s.workers[owner] || []).map((w, t) => ({ owner, t, w })).filter(x => !s.off[owner][x.t] && timerReady(s, x.w, now));
  }
  function workerReady(s, pid, now) { return ownersFor(s, pid).some(o => usable(s, o, now).length > 0); }
  function workerLeft(s, pid, now) {
    if (workerReady(s, pid, now)) return 0;
    const left = [];
    ownersFor(s, pid).forEach(o => s.workers[o].forEach((w, t) => { if (w && !s.off[o][t]) left.push(w.start + workerMs(s) - now); }));
    return left.length ? Math.min.apply(null, left) : 0;
  }
  // Which timer moves when a chef taps a space: the one already on that space, then an unused one,
  // then the longest-finished one — the chef's own before a shared temp.
  function pickTimer(s, pid, area, idx, now) {
    for (const owner of ownersFor(s, pid)) {
      const ok = usable(s, owner, now);
      if (!ok.length) continue;
      const same = ok.find(x => x.w && x.w.area === area && x.w.idx === idx);
      if (same) return same;
      const free = ok.find(x => !x.w);
      if (free) return free;
      return ok.sort((a, b) => a.w.start - b.w.start)[0];
    }
    return null;
  }
  function freeSpace(s, owner, t, w) {
    // A shared chef can move to another player's action. Their previous visit ends.
    const op = s.open[w.by];
    if (op && op.worker && op.worker.owner === owner && op.worker.t === t && op.worker.start === w.start) s.open[w.by] = null;
    if (w.area === 'van') s.spaces.van = s.spaces.van.filter(x => !(x.pid === owner && x.t === t));
    else if (s.spaces[w.area]) s.spaces[w.area][w.idx] = null;
  }

  // Canggu cancel: what a visit did that needs the full sand to count.
  function undoVisit(s, w) {
    const lost = [];
    (w.cooked || []).forEach(id => {
      const o = s.orders.find(x => x.id === id);
      if (o && !o.served && o.row > 0) { o.row--; lost.push(`cooking on ${DISHES[o.dish].name}`); }
    });
    let washed = 0;
    (w.washed || []).forEach(size => { if (s.cupboard[size] > 0) { s.cupboard[size]--; s.dirty[size]++; washed++; } });
    if (washed) lost.push(`${washed} washed plate${washed > 1 ? 's' : ''}`);
    return lost.join(' and ');
  }
  const visitOf = (s, op) => op && op.worker ? (() => { const w = (s.workers[op.worker.owner] || [])[op.worker.t]; return w && w.start === op.worker.start ? w : null; })() : null;

  // ---- checking meals ----
  function plateOk(s, o) {
    const d = DISHES[o.dish];
    if (!o.plate) return false;
    if (o.plate === d.plate) return true;
    return cfgOf(s).bigger && PLATES.indexOf(o.plate) === PLATES.indexOf(d.plate) + 1;
  }
  function checkOrder(s, o) {
    const d = DISHES[o.dish];
    const r = [];
    if (!o.plate) r.push('no plate');
    else if (!plateOk(s, o)) r.push(`wrong plate: ${PLATE_NAME[o.plate].toLowerCase()} instead of ${PLATE_NAME[d.plate].toLowerCase()}`);
    ING.forEach(i => {
      const have = o.ing[i] || 0, need = d.ing[i] || 0;
      if (have < need) r.push(`missing ${need - have}× ${ING_INFO[i].n.toLowerCase()}`);
      if (have > need) r.push(`${have - need}× ${ING_INFO[i].n.toLowerCase()} too many`);
    });
    SPICES.forEach(i => {
      const have = (o.sp || {})[i] || 0, need = d.sp[i] || 0;
      if (have < need) r.push(`missing ${need - have}× ${SP_INFO[i].n.toLowerCase()}`);
      if (have > need) r.push(`${have - need}× ${SP_INFO[i].n.toLowerCase()} too many`);
    });
    if (o.row < d.cook) r.push(`undercooked: ${o.row} of ${d.cook}`);
    else if (o.row > d.cook) r.push(`overcooked: ${o.row} instead of ${d.cook}`);
    return r;
  }
  const needsIng = (o, i) => (o.ing[i] || 0) < (DISHES[o.dish].ing[i] || 0);
  const needsSp = (o, i) => ((o.sp || {})[i] || 0) < (DISHES[o.dish].sp[i] || 0);
  const ingComplete = o => ING.every(i => (o.ing[i] || 0) === (DISHES[o.dish].ing[i] || 0));
  function isMistake(s, o) {
    const d = DISHES[o.dish];
    if (o.plate && !plateOk(s, o)) return true;
    if (ING.some(i => (o.ing[i] || 0) > (d.ing[i] || 0))) return true;
    if (SPICES.some(i => ((o.sp || {})[i] || 0) > (d.sp[i] || 0))) return true;
    if (o.row > d.cook) return true;
    return o.row > 0 && !ingComplete(o);
  }
  // A guest = one order, or both parts of a VIP order.
  function guests(s) {
    const map = new Map();
    s.orders.forEach(o => {
      const k = o.group || o.id;
      if (!map.has(k)) map.set(k, { key: k, pid: o.pid, patron: o.patron || o.dish, parts: [] });
      map.get(k).parts.push(o);
    });
    return Array.from(map.values()).map(g => {
      const reasons = g.parts.flatMap(o => checkOrder(s, o).map(r => (g.parts.length > 1 ? `${DISHES[o.dish].name}: ` : '') + r));
      return Object.assign(g, { ok: reasons.length === 0, reasons, early: g.parts.some(o => o.served), kind: kindOf(g.patron) });
    });
  }

  // Projected result if the only shift ended now (used for "goal reached at" in one-shift restaurants).
  function tally(s) {
    const G = guests(s);
    const per = s.players.map(p => ({ id: p.id, served: G.filter(g => g.pid === p.id && g.ok).length }));
    const served = G.filter(g => g.ok).length;
    const mealCoins = G.filter(g => g.ok).reduce((a, g) => a + DISHES[g.patron].c, 0);
    const coins = cfgOf(s).money ? Math.max(0, s.coins + mealCoins - (G.length - served)) : 0;
    const goal = s.goal;
    const win = goal.each ? per.every(x => x.served >= goal.each) : goal.meals ? served >= goal.meals : coins >= (goal.coins || 0);
    return { served, coins, win };
  }

  function inPlay(s, now) { return (s.phase === 'play' && now >= s.shiftStart) || s.phase === 'grace'; }

  function stat(s, pid, area) {
    const st = s.stats[pid];
    st.actions++;
    st.byArea[area] = (st.byArea[area] || 0) + 1;
  }

  // Two-chef rule: ingredients, spices and cooking may go to the partner's meals too.
  function teamOrder(s, pid, id) {
    const o = s.orders.find(x => x.id === id);
    if (o && s.duo && o.pid !== pid && s.players.some(p => p.id === o.pid)) {
      if (o.served) throw new Error('This meal is already served.');
      return o;
    }
    return ownOrder(s, pid, id);
  }
  // Putting a meal aside only collapses its ticket. Bring it back before editing it.
  // Early service remains irreversible; all meals are checked at the end of the shift.
  function unlocked(o) {
    if (o.parked) throw new Error('Bring this meal back to your orders before changing it.');
    return o;
  }
  function ownOrder(s, pid, id) {
    const o = s.orders.find(x => x.id === id);
    if (!o) throw new Error('That order is gone.');
    if (o.pid !== pid) throw new Error('That is not your guest.');
    if (o.served) throw new Error('This meal is already served.');
    return o;
  }

  const HOST_ONLY = ['start', 'endNow', 'nextShift', 'finishShift'];

  function apply(s, a, now) {
    try {
      doApply(s, a, now);
      if (s.phase === 'play' && s.shifts === 1 && s.goalAt == null && now >= s.shiftStart && tally(s).win) s.goalAt = now - s.shiftStart;
      return null;
    } catch (e) {
      return e.message;
    }
  }

  function doApply(s, a, now) {
    const pid = a.pid;
    const cfg = cfgOf(s);
    const strict = !!s.settings.strict;
    if (s.paused && !HOST_ONLY.includes(a.type)) throw new Error('The game is paused until everyone is back.');
    if (!HOST_ONLY.includes(a.type) && !s.players.some(p => p.id === pid)) throw new Error('You are watching this round.');
    const AREAS_OF = { storage: ['storA', 'storB', 'storC'], spice: ['green'], order: ['dining'], cook: ['stove'], wash: ['sink'], shop: ['van'], office: ['office'], reception: ['reception'] };
    const needOpen = (type, msg) => {
      if (!inPlay(s, now)) throw new Error('The shift is not running.');
      const op = s.open[pid];
      if (!op || op.type !== type) {
        // Rulebook (multitasking): placing your next timer ends the action before it, even while
        // the first timer's sand is still running. Explain that instead of a generic message.
        const still = ownersFor(s, pid).some(o => (s.workers[o] || []).some(w => w && w.by === pid && AREAS_OF[type].includes(w.area)));
        if (still) throw new Error('That visit ended when you started your next action. Send a free timer there for a new visit.');
        throw new Error(msg);
      }
      return op;
    };
    switch (a.type) {
      case 'start': {
        if (s.phase !== 'ready') throw new Error('Already started.');
        s.phase = 'play';
        s.shiftStart = now + 3000; // 3-2-1 countdown
        s.shiftEnd = s.shiftStart + s.settings.shiftSec * 1000;
        planMoments(s);
        return;
      }
      case 'place': {
        if (s.phase !== 'play') throw new Error('The shift is not running.');
        if (now < s.shiftStart) throw new Error('Wait for the countdown.');
        if (now >= s.shiftEnd) throw new Error('Time is up — no new actions.');
        const slots = s.spaces[a.area];
        const van = a.area === 'van';
        if (!slots || (!van && (a.idx < 0 || a.idx >= slots.length))) throw new Error('No such space.');
        if (van && s.coins < 1) throw new Error('The office has no coins left to go shopping.');
        if (s.locked[ROOM_OF[a.area]]) throw new Error('Fridge B is locked — call the locksmith from the office.');
        if (s.broken && s.broken.area === a.area && s.broken.idx === a.idx) throw new Error('This stove is broken — call Pak Made the fixer from the office.');
        const occ = van ? null : slots[a.idx];
        const mine = occ && (occ.pid === pid || ownersFor(s, pid).includes(occ.pid));
        if (occ && !mine) throw new Error('Someone else is working there.');
        if (occ && !timerReady(s, s.workers[occ.pid][occ.t], now)) throw new Error('Your timer is still running here.');
        // Reusing a ready shared worker must move that worker, not overwrite it with an unused own worker.
        const pick = occ ? { owner: occ.pid, t: occ.t, w: s.workers[occ.pid][occ.t] } : pickTimer(s, pid, a.area, van ? -1 : a.idx, now);
        if (!pick) {
          const n = s.workers[pid].filter((w, t) => !s.off[pid][t]).length;
          if (!n) throw new Error('All your crew are out surfing until they are paid.');
          throw new Error(`${n > 1 ? 'Your timers are' : 'Your timer is'} still running (${Math.ceil(workerLeft(s, pid, now) / 1000)} s).`);
        }
        const { owner, t, w } = pick;
        settleReception(s, pid, now);
        if (w) freeSpace(s, owner, t, w);
        const entry = { pid: owner, t, start: now, by: pid };
        // freeSpace may have replaced the van list, so look the space up again
        if (van) s.spaces.van.push(entry); else s.spaces[a.area][a.idx] = entry;
        s.workers[owner][t] = { area: a.area, idx: van ? -1 : a.idx, start: now, by: pid };
        stat(s, pid, a.area);
        // Starting a new action ends the one before it.
        if (a.area === 'reception') {
          if (cfg.throwOut || headGroup(s)) s.open[pid] = { type: 'reception' };
          else {
            const empty = s.seats.filter(x => !x.reserved && !x.dish).length;
            const k = seatPatrons(s, has(s, 'seats') ? 3 : 2, { by: pid, now });
            s.open[pid] = null;
            if (k) feed(s, now, pid, 'seat', { n: k });
            if (!k) s.errs[pid] = { msg: empty ? 'No more guests are waiting outside.' : 'All tables are full.', t: now, info: true };
          }
        } else if (a.area === 'dining') s.open[pid] = { type: 'order' };
        else if (a.area === 'stove') s.open[pid] = { type: 'cook' };
        else if (a.area === 'green') s.open[pid] = { type: 'spice' };
        else if (a.area === 'sink') s.open[pid] = { type: 'wash', left: has(s, 'sink') ? 5 : 3 };
        else if (a.area === 'office') s.open[pid] = { type: 'office' };
        else if (van) s.open[pid] = { type: 'shop', left: s.duo ? 2 : 1 };
        else s.open[pid] = { type: 'storage', room: ROOM_OF[a.area] };
        if (s.open[pid]) s.open[pid].worker = { owner, t, start: now };
        // Canggu: a chef in any storage room takes in a waiting delivery.
        if (ROOM_OF[a.area]) (s.moments || []).forEach(m => {
          if (m.kind === 'delivery' && m.state === 'live' && now <= m.until) { m.by = pid; endMoment(s, m, true, now); s.errs[pid] = { msg: `🧊 Delivery in! +${DELIVERY_N} ${ING_INFO[m.ing].n} in Fridge A.`, t: now, info: true }; }
        });
        return;
      }
      case 'recall': {
        if (!inPlay(s, now)) throw new Error('The shift is not running.');
        if (!ownersFor(s, pid).includes(a.owner)) throw new Error('That chef belongs to another player.');
        const w = (s.workers[a.owner] || [])[a.t];
        if (!w) throw new Error('That chef is already off the floor.');
        // Canggu: a running chef can be cancelled. The worker is free at once; cooking and
        // washing done on this visit are lost, ingredients and spices already on a plate stay.
        if (!timerReady(s, w, now)) {
          if (!a.cancel) throw new Error('That chef is still working.');
          const lost = undoVisit(s, w);
          s.errs[pid] = { msg: lost ? `Cancelled — ${lost} lost.` : 'Cancelled — the chef is free.', t: now, info: true };
          feed(s, now, pid, 'cancel', { area: w.area });
        }
        settleReception(s, pid, now);
        freeSpace(s, a.owner, a.t, w);
        s.workers[a.owner][a.t] = null;
        return;
      }
      case 'done': { settleReception(s, pid, now); s.open[pid] = null; return; }
      case 'park': {
        if (!inPlay(s, now)) throw new Error('The shift is not running.');
        const o = unlocked(ownOrder(s, pid, a.order));
        if (strict && checkOrder(s, o).length) throw new Error('This meal isn\'t finished yet — finish it before putting it aside.');
        o.parked = true;
        feed(s, now, pid, 'park', { dish: o.dish });
        return;
      }
      case 'unpark': {
        if (!inPlay(s, now)) throw new Error('The shift is not running.');
        const o = ownOrder(s, pid, a.order);
        o.parked = false;
        return;
      }
      case 'seat': {
        needOpen('reception', 'Send a chef to the front desk first.');
        const empty = s.seats.filter(x => !x.reserved && !x.dish).length;
        const k = seatPatrons(s, has(s, 'seats') ? 3 : 2, { by: pid, now });
        s.open[pid] = null;
        if (k) feed(s, now, pid, 'seat', { n: k });
        if (!k) s.errs[pid] = { msg: empty ? 'No more guests are waiting outside.' : 'All tables are full.', t: now, info: true };
        return;
      }
      case 'throwOut': {
        // Scenario 6+: send 1–2 waiting guests away; new guests take their seats but, having seen that, order no drinks.
        needOpen('reception', 'Send a chef to the front desk first.');
        const seats = Array.from(new Set(a.seats || []));
        if (seats.length < 1 || seats.length > 2) throw new Error('Pick one or two guests.');
        if (seats.some(i => !s.seats[i] || !s.seats[i].dish)) throw new Error('Nobody sits there.');
        seats.forEach(i => { s.discard.push(s.seats[i].dish); s.seats[i].dish = null; });
        seatPatrons(s, seats.length, { noDrinks: true, now });
        L(s, pid).thrown += seats.length;
        feed(s, now, pid, 'throw', { n: seats.length });
        s.open[pid] = null;
        return;
      }

// Sync between iPads over a public MQTT relay (no account, no setup).
// The host iPad owns the game state and publishes it as a retained message, so an iPad that

// Every iPad talks to all relays at once: the host publishes on each one it reaches and guests
